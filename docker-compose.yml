# Local services (SPEC 15). The app itself runs from the IDE or ./mvnw spring-boot:run.
# Values come from .env (copy .env.example); defaults below match it.
name: ecommerce

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-ecommerce}
      DB_OWNER_USER: ${DB_OWNER_USER:-app_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-app_owner_local}
      DB_APP_USER: ${DB_APP_USER:-app_user}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-app_user_local}
      DB_PLATFORM_USER: ${DB_PLATFORM_USER:-app_platform}
      DB_PLATFORM_PASSWORD: ${DB_PLATFORM_PASSWORD:-app_platform_local}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME:-ecommerce}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # MinIO no longer publishes community images on Docker Hub; Chainguard's build is pinned by digest.
  # The media bucket is created by the app's media module (M3), so there is no init container.
  minio:
    image: chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  minio-data:
