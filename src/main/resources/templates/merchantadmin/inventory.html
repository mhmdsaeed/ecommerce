<!DOCTYPE html>
<!--/* Inventory. The search box swaps "results"; each row's stock form swaps itself ("stock"). */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title th:text="#{inventory.title}">Inventory</title>
</head>
<body>
<main layout:fragment="content">
    <h1 class="text-2xl font-bold" th:text="#{inventory.title}">Inventory</h1>
    <p class="mt-2 text-sm text-gray-600" th:text="#{inventory.intro}">Leave the quantity empty for items you don't track.</p>
    <th:block th:if="${param.saved}"><div class="mt-4" th:replace="~{fragments/forms :: alert(kind='info', message=#{inventory.saved})}"></div></th:block>
    <th:block th:if="${param.invalid}"><div class="mt-4" th:replace="~{fragments/forms :: alert(kind='error', message=#{inventory.not-saved})}"></div></th:block>

    <form method="get" th:action="@{/admin/inventory}" class="mt-6 flex gap-3" role="search"
          th:hx-get="@{/admin/inventory}" hx-target="#inventory-results" hx-push-url="true"
          hx-trigger="input delay:300ms from:#q, submit">
        <label for="q" class="sr-only" th:text="#{inventory.search}">Search</label>
        <input id="q" name="q" type="search" th:value="${q}" th:placeholder="#{inventory.search}"
               class="min-w-0 flex-1 rounded-md border border-gray-300 bg-white px-3 py-2 text-base focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
        <noscript><button type="submit" class="rounded-md border border-gray-300 px-4 py-2" th:text="#{inventory.search}">Search</button></noscript>
    </form>

    <div id="inventory-results" th:fragment="results" class="mt-4">
        <p th:if="${result.items().isEmpty()}" class="rounded-lg border border-dashed border-gray-300 bg-white p-8 text-center text-gray-600"
           th:text="${q == null or q.isBlank()} ? #{inventory.empty} : #{inventory.no-match}">No products yet.</p>

        <!--/* One row per variant: the product (and its status unless published), the variant and SKU, then its stock
               form. Rows stack on phones. */-->
        <ul th:unless="${result.items().isEmpty()}" class="divide-y divide-gray-100 rounded-lg border border-gray-200 bg-white text-sm">
            <li th:each="row : ${result.items()}"
                class="grid gap-x-4 gap-y-2 px-4 py-3 md:grid-cols-[minmax(0,2fr)_minmax(0,1.5fr)_minmax(0,2.5fr)] md:items-center">
                <div>
                    <a th:href="@{/admin/products/{id}(id=${row.productId()})}" class="font-medium hover:underline"
                       th:text="${row.productName().in(#locale)}">Product</a>
                    <th:block th:if="${row.status().name() != 'ACTIVE'}">
                        <span th:replace="~{merchantadmin/fragments/catalog :: status-badge(status=${row.status()})}">Status</span>
                    </th:block>
                </div>
                <div class="text-gray-700">
                    <span th:text="${row.label().isEmpty()} ? '—' : ${row.label()}">M / أحمر</span>
                    <span th:unless="${row.active()}" class="ms-1 text-xs text-gray-500" th:text="#{inventory.inactive}">Inactive</span>
                    <bdi th:if="${row.sku() != null}" class="block text-xs text-gray-500" th:text="${row.sku()}">SKU-1</bdi>
                </div>
                <div th:with="level=${levels.of(row.id()).orElse(null)}">
                    <form th:replace="~{merchantadmin/inventory :: stock(variantId=${row.id()}, level=${level}, value=${level == null ? '' : level.onHand()}, saved=false, error=null, errorArgument=null)}"></form>
                </div>
            </li>
        </ul>

        <nav th:if="${result.totalPages() > 1}" class="mt-4 flex items-center justify-between text-sm" th:attr="aria-label=#{product.pages}">
            <a th:if="${result.hasPrevious()}"
               th:href="@{/admin/inventory(q=${q}, page=${result.page() - 1})}"
               th:hx-get="@{/admin/inventory(q=${q}, page=${result.page() - 1})}" hx-target="#inventory-results" hx-push-url="true"
               class="text-brand-700 hover:underline" th:text="#{product.page.previous}">Previous</a>
            <span th:unless="${result.hasPrevious()}"></span>
            <span class="text-gray-500" th:text="#{product.page.of(${result.page() + 1}, ${result.totalPages()})}">1 / 2</span>
            <a th:if="${result.hasNext()}"
               th:href="@{/admin/inventory(q=${q}, page=${result.page() + 1})}"
               th:hx-get="@{/admin/inventory(q=${q}, page=${result.page() + 1})}" hx-target="#inventory-results" hx-push-url="true"
               class="text-brand-700 hover:underline" th:text="#{product.page.next}">Next</a>
        </nav>
    </div>
</main>

<!--/* Outside the page content, so the layout leaves it out; rendered only by name. */-->
<th:block>
    <!--/* One variant's stock. level is null when it is not tracked; error is a message key, errorArgument its value.
           Nothing left to sell (tracked, none available) shows in amber: shoppers see it as sold out. */-->
    <form th:fragment="stock(variantId, level, value, saved, error, errorArgument)"
          method="post" th:action="@{/admin/inventory/{id}(id=${variantId})}"
          th:hx-post="@{/admin/inventory/{id}(id=${variantId})}" hx-target="this" hx-swap="outerHTML"
          class="flex flex-wrap items-center gap-2">
        <label th:for="|on-hand-${variantId}|" class="sr-only" th:text="#{inventory.col.on-hand}">On hand</label>
        <input th:id="|on-hand-${variantId}|" name="onHand" th:value="${value}" inputmode="numeric" autocomplete="off"
               th:placeholder="#{inventory.untracked}"
               th:attr="aria-invalid=${error != null} ? 'true' : null, aria-describedby=${error != null} ? |on-hand-${variantId}-error| : null"
               class="w-28 rounded-md border px-2 py-1.5 text-base tabular-nums focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600"
               th:classappend="${level != null and level.available() <= 0} ? 'border-amber-400 bg-amber-50' : 'border-gray-300'">
        <button type="submit" class="rounded-md border border-gray-300 px-3 py-1.5 hover:border-brand-600"
                th:text="#{inventory.save}">Save</button>
        <span th:if="${level != null and level.available() <= 0}"
              class="rounded-full bg-amber-100 px-2 py-0.5 text-xs font-semibold text-amber-900" th:text="#{inventory.sold-out}">Out of stock</span>
        <span th:if="${level != null}" class="text-xs text-gray-500"
              th:text="#{inventory.reserved-available(${level.reserved()}, ${level.available()})}">0 reserved · 5 available</span>
        <span th:if="${saved}" role="status" class="text-xs text-brand-700" th:text="#{inventory.saved}">Saved</span>
        <p th:if="${error != null}" th:id="|on-hand-${variantId}-error|" role="alert" class="w-full text-xs text-red-700"
           th:text="#{__${error}__(${errorArgument})}">Invalid</p>
    </form>
</th:block>
</body>
</html>
