<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title th:text="#{staff.edit.title(${member.name()})}">Edit staff member</title>
</head>
<body>
<main layout:fragment="content" class="space-y-8">
    <div>
        <a th:href="@{/admin/staff}" class="text-sm text-brand-700 hover:underline" th:text="#{staff.edit.back}">Back to staff</a>
        <h1 class="mt-2 text-2xl font-bold" th:text="${member.name()}">Name</h1>
    </div>

    <section class="max-w-lg rounded-lg border border-gray-200 bg-white p-6">
        <h2 class="text-lg font-semibold" th:text="#{staff.edit.details}">Details</h2>
        <form th:action="@{/admin/staff/{id}(id=${member.id()})}" th:object="${form}" method="post" class="mt-4 space-y-4" novalidate>
            <div th:replace="~{fragments/forms :: input(field='name', label=#{staff.field.name}, autocomplete='off')}"></div>
            <div th:replace="~{fragments/forms :: input(field='phone', label=#{staff.field.phone}, type='tel',
                    autocomplete='off', ltr=true, hint=#{staff.field.contact.hint})}"></div>
            <div th:replace="~{fragments/forms :: input(field='email', label=#{staff.field.email}, type='email',
                    autocomplete='off', ltr=true)}"></div>
            <div class="space-y-1">
                <label for="role" class="block text-sm font-medium text-gray-800" th:text="#{staff.field.role}">Role</label>
                <select th:field="*{role}"
                        class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-base focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
                    <option th:each="role : ${assignableRoles}" th:value="${role}" th:text="#{role.__${role}__}">Role</option>
                </select>
                <p class="text-xs text-gray-500" th:text="#{staff.edit.role.hint}">Hint</p>
            </div>
            <button th:replace="~{fragments/forms :: submit(label=#{staff.edit.submit})}">Save</button>
        </form>
    </section>

    <section class="max-w-lg rounded-lg border border-gray-200 bg-white p-6">
        <h2 class="text-lg font-semibold" th:text="#{staff.edit.password.heading}">New password</h2>
        <p class="mt-1 text-sm text-gray-600" th:text="#{staff.edit.password.intro}">Intro</p>
        <form th:action="@{/admin/staff/{id}/password(id=${member.id()})}" th:object="${passwordForm}" method="post"
              class="mt-4 space-y-4" novalidate>
            <div th:replace="~{fragments/forms :: input(field='newPassword', label=#{staff.field.password}, type='password',
                    autocomplete='new-password', hint=#{signup.field.password.hint})}"></div>
            <button th:replace="~{fragments/forms :: submit(label=#{staff.edit.password.submit})}">Set password</button>
        </form>
    </section>
</main>
</body>
</html>
