<!DOCTYPE html>
<!--/* Orders, newest first (model: orders, an Orders.OrderPage; view, payment, q: the filters; staffNames). Changing a
       filter swaps the "results" fragment and puts the filters in the URL. */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title th:text="#{admin.orders.title}">Orders</title>
</head>
<body>
<main layout:fragment="content">
    <h1 class="text-2xl font-bold" th:text="#{admin.orders.title}">Orders</h1>

    <form method="get" th:action="@{/admin/orders}" class="mt-6 flex flex-wrap gap-3" role="search"
          th:hx-get="@{/admin/orders}" hx-target="#order-results" hx-push-url="true"
          hx-trigger="input delay:300ms from:#q, change from:#view, change from:#payment, submit">
        <label for="q" class="sr-only" th:text="#{admin.orders.search}">Search</label>
        <input id="q" name="q" type="search" th:value="${q}" th:placeholder="#{admin.orders.search}"
               class="min-w-0 flex-1 rounded-md border border-gray-300 bg-white px-3 py-2 text-base focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
        <label for="view" class="sr-only" th:text="#{admin.orders.col.status}">Status</label>
        <select id="view" name="view"
                class="rounded-md border border-gray-300 bg-white px-3 py-2 text-base focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
            <option value="open" th:selected="${view == 'open'}" th:text="#{admin.orders.view.open}">Open</option>
            <option value="all" th:selected="${view == 'all'}" th:text="#{admin.orders.view.all}">All</option>
            <option th:each="status : ${statuses}" th:value="${status}" th:selected="${view == status.name()}"
                    th:text="#{order.status.__${status}__}">Pending</option>
        </select>
        <label for="payment" class="sr-only" th:text="#{admin.orders.col.payment}">Payment</label>
        <select id="payment" name="payment"
                class="rounded-md border border-gray-300 bg-white px-3 py-2 text-base focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
            <option value="" th:text="#{admin.orders.payment.any}">Any payment</option>
            <option th:each="status : ${paymentStatuses}" th:value="${status}" th:selected="${payment == status}"
                    th:text="#{payment.status.__${status}__}">Unpaid</option>
        </select>
        <noscript><button type="submit" class="rounded-md border border-gray-300 px-4 py-2" th:text="#{admin.orders.filter}">Filter</button></noscript>
    </form>

    <div id="order-results" th:fragment="results" class="mt-4">
        <p th:if="${orders.rows().isEmpty()}" class="rounded-lg border border-dashed border-gray-300 bg-white p-6 text-center text-gray-600"
           th:text="${q == null and view == 'open' and payment == null} ? #{admin.orders.none-open} : #{admin.orders.no-match}">No orders yet.</p>

        <div th:unless="${orders.rows().isEmpty()}" class="overflow-x-auto rounded-lg border border-gray-200 bg-white">
            <table class="w-full text-sm">
                <thead class="bg-gray-50 text-gray-600">
                <tr>
                    <th scope="col" class="px-4 py-3 text-start font-medium" th:text="#{admin.orders.col.number}">Order</th>
                    <th scope="col" class="px-4 py-3 text-start font-medium" th:text="#{admin.orders.col.placed}">Placed</th>
                    <th scope="col" class="px-4 py-3 text-start font-medium" th:text="#{admin.orders.col.customer}">Customer</th>
                    <th scope="col" class="px-4 py-3 text-start font-medium" th:text="#{admin.orders.col.total}">Total</th>
                    <th scope="col" class="px-4 py-3 text-start font-medium" th:text="#{admin.orders.col.status}">Status</th>
                    <th scope="col" class="px-4 py-3 text-start font-medium" th:text="#{admin.orders.col.payment}">Payment</th>
                    <th scope="col" class="px-4 py-3 text-start font-medium" th:text="#{admin.orders.col.driver}">Driver</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                <tr th:each="row : ${orders.rows()}">
                    <td class="px-4 py-3">
                        <a th:href="@{/admin/orders/{number}(number=${row.number()})}" class="font-medium text-brand-700 hover:underline"
                           th:text="|#${row.number()}|">#1001</a>
                    </td>
                    <td class="px-4 py-3 whitespace-nowrap" th:text="${@dates.format(row.placedAt())}">14 Oct</td>
                    <td class="px-4 py-3">
                        <div th:text="${row.customerName()}">Name</div>
                        <div class="text-xs text-gray-500" dir="ltr" th:text="${row.customerPhone()}">+963</div>
                    </td>
                    <td class="px-4 py-3 whitespace-nowrap"><bdi th:text="${@money.format(row.total())}">5,000</bdi></td>
                    <td class="px-4 py-3">
                        <span class="rounded-full px-2 py-0.5 text-xs"
                              th:classappend="${row.status().name() == 'PENDING_CONFIRMATION'} ? 'bg-amber-100 text-amber-900' : (${row.status().isOpen()} ? 'bg-brand-50 text-brand-700' : 'bg-gray-100 text-gray-700')"
                              th:text="#{order.status.__${row.status()}__}">Pending</span>
                    </td>
                    <td class="px-4 py-3">
                        <div th:text="#{payment.method.__${row.paymentMethod()}__}">COD</div>
                        <div class="text-xs" th:classappend="${row.paymentStatus().name() == 'AWAITING_VERIFICATION'} ? 'font-medium text-amber-800' : 'text-gray-500'"
                             th:text="#{payment.status.__${row.paymentStatus()}__}">Unpaid</div>
                    </td>
                    <td class="px-4 py-3 text-gray-600" th:text="${row.driverId() != null} ? ${staffNames.get(row.driverId())} : '—'">Driver</td>
                </tr>
                </tbody>
            </table>
        </div>

        <nav th:if="${orders.page() > 0 or orders.hasNext()}" class="mt-4 flex justify-between text-sm" th:attr="aria-label=#{admin.orders.pages}">
            <a th:if="${orders.page() > 0}" th:href="@{/admin/orders(view=${view}, payment=${payment}, q=${q}, page=${orders.page() - 1})}"
               th:hx-get="@{/admin/orders(view=${view}, payment=${payment}, q=${q}, page=${orders.page() - 1})}" hx-target="#order-results" hx-push-url="true"
               class="text-brand-700 hover:underline" th:text="#{admin.orders.newer}">Newer</a>
            <span th:unless="${orders.page() > 0}"></span>
            <a th:if="${orders.hasNext()}" th:href="@{/admin/orders(view=${view}, payment=${payment}, q=${q}, page=${orders.page() + 1})}"
               th:hx-get="@{/admin/orders(view=${view}, payment=${payment}, q=${q}, page=${orders.page() + 1})}" hx-target="#order-results" hx-push-url="true"
               class="text-brand-700 hover:underline" th:text="#{admin.orders.older}">Older</a>
        </nav>
    </div>
</main>
</body>
</html>
