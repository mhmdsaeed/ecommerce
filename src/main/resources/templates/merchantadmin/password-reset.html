<!DOCTYPE html>
<!--/* The page a reset link opens: a new password, or "this link no longer works" (expired). The store and token
       travel in hidden fields; the response carries Referrer-Policy: no-referrer. */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title th:text="#{password.reset.title}">Choose a new password</title>
    <meta name="robots" content="noindex">
</head>
<body>
<main layout:fragment="content">
    <section class="mx-auto max-w-md overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm">
        <div th:replace="~{fragments/auth :: sign(store=${expired} ? null : ${passwordForm.store}, domain=${storeDomain},
                state=${expired} ? 'closed' : 'open', live=false)}"></div>
        <div class="p-6">
        <th:block th:if="${expired}">
            <h1 class="text-2xl font-bold" th:text="#{password.reset.expired.heading}">This link no longer works</h1>
            <p class="mt-2 text-sm text-gray-600" th:text="#{password.reset.expired.body}">Body</p>
            <a th:href="@{/admin/password/forgot}" class="mt-6 inline-block font-medium text-brand-700 hover:underline"
               th:text="#{password.reset.expired.again}">Send a new link</a>
        </th:block>

        <th:block th:unless="${expired}">
            <h1 class="text-2xl font-bold" th:text="#{password.reset.heading}">Choose a new password</h1>
            <form th:action="@{/admin/password/reset}" th:object="${passwordForm}" method="post" class="mt-4 space-y-4" novalidate>
                <input type="hidden" th:field="*{store}">
                <input type="hidden" th:field="*{token}">
                <div th:replace="~{fragments/forms :: input(field='newPassword', label=#{account.field.new}, type='password',
                        autocomplete='new-password', hint=#{signup.field.password.hint})}"></div>
                <div th:replace="~{fragments/forms :: input(field='confirmPassword', label=#{account.field.confirm},
                        type='password', autocomplete='new-password')}"></div>
                <button th:replace="~{fragments/forms :: submit(label=#{password.reset.submit})}">Save password</button>
            </form>
        </th:block>
        </div>
    </section>
</main>
</body>
</html>
