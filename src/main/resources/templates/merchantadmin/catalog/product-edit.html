<!DOCTYPE html>
<!--/* Product edit page. The "images" and "variants" fragments are swapped over HTMX. */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title th:text="${product.name().in(#locale)}">Product</title>
</head>
<body>
<main layout:fragment="content" class="space-y-8">
    <div>
        <a th:href="@{/admin/products}" class="text-sm text-brand-700 hover:underline" th:text="#{product.back}">Products</a>
        <div class="mt-2 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <h1 class="text-2xl font-bold" th:text="${product.name().in(#locale)}">Product</h1>
                <span th:replace="~{merchantadmin/fragments/catalog :: status-badge(status=${product.status()})}">Draft</span>
            </div>
            <div class="flex flex-wrap gap-2">
                <form th:if="${product.status().name() != 'ACTIVE'}" th:action="@{/admin/products/{id}/status(id=${product.id()})}" method="post">
                    <input type="hidden" name="status" value="ACTIVE">
                    <button type="submit" class="rounded-md bg-brand-600 px-4 py-2 text-sm font-medium text-white hover:bg-brand-700"
                            th:text="#{product.action.publish}">Publish</button>
                </form>
                <form th:if="${product.status().name() == 'ACTIVE'}" th:action="@{/admin/products/{id}/status(id=${product.id()})}" method="post">
                    <input type="hidden" name="status" value="ARCHIVED">
                    <button type="submit" class="rounded-md border border-gray-300 px-4 py-2 text-sm hover:bg-gray-50"
                            th:text="#{product.action.archive}">Archive</button>
                </form>
                <form th:if="${product.status().name() != 'DRAFT'}" th:action="@{/admin/products/{id}/status(id=${product.id()})}" method="post">
                    <input type="hidden" name="status" value="DRAFT">
                    <button type="submit" class="rounded-md border border-gray-300 px-4 py-2 text-sm hover:bg-gray-50"
                            th:text="#{product.action.unpublish}">Back to draft</button>
                </form>
                <form th:if="${product.status().name() == 'DRAFT'}" th:action="@{/admin/products/{id}/delete(id=${product.id()})}" method="post"
                      th:data-confirm="#{product.delete.confirm}"
                      x-data x-on:submit="if (!confirm($el.dataset.confirm)) $event.preventDefault()">
                    <button type="submit" class="rounded-md border border-red-200 px-4 py-2 text-sm text-red-700 hover:bg-red-50"
                            th:text="#{product.action.delete}">Delete</button>
                </form>
            </div>
        </div>
        <div class="mt-4 space-y-2">
            <th:block th:if="${error != null}"><div th:replace="~{fragments/forms :: alert(kind='error', message=#{${error}})}"></div></th:block>
            <th:block th:if="${param.created}"><div th:replace="~{fragments/forms :: alert(kind='info', message=#{product.created})}"></div></th:block>
            <th:block th:if="${param.saved}"><div th:replace="~{fragments/forms :: alert(kind='info', message=#{product.saved})}"></div></th:block>
            <th:block th:if="${param.status}"><div th:replace="~{fragments/forms :: alert(kind='info', message=#{product.status.changed})}"></div></th:block>
        </div>
    </div>

    <!--/* Images */-->
    <section id="images" th:fragment="images" class="rounded-lg border border-gray-200 bg-white p-6">
        <h2 class="text-lg font-semibold"
            th:text="#{product.images.heading(${product.images().size()}, ${maxImages})}">Images</h2>
        <ul th:if="${uploadOutcomes != null}" class="mt-3 space-y-1 text-sm">
            <li th:each="outcome : ${uploadOutcomes}" th:classappend="${outcome.ok()} ? 'text-brand-700' : 'text-red-700'">
                <span th:if="${outcome.fileName() != null}" class="font-medium" dir="auto" th:text="${outcome.fileName()} + ':'">photo.jpg:</span>
                <span th:text="#{${outcome.message()}}">Added</span>
            </li>
        </ul>
        <p th:if="${product.images().isEmpty()}" class="mt-3 text-sm text-gray-600" th:text="#{product.images.empty}">No images yet.</p>
        <ul th:unless="${product.images().isEmpty()}" class="mt-4 grid grid-cols-2 gap-4 sm:grid-cols-4">
            <li th:each="image, state : ${product.images()}" class="space-y-2">
                <img th:with="url=${@imageUrls.medium(image.storageKey())}" th:src="${url}" th:width="${image.width()}" th:height="${image.height()}"
                     loading="lazy" alt="" class="aspect-square w-full rounded-md border border-gray-200 object-cover">
                <p th:if="${state.first}" class="text-xs text-gray-500" th:text="#{product.images.main}">Main image</p>
                <div class="flex flex-wrap gap-3 text-sm">
                    <form th:unless="${state.first}" th:action="@{/admin/products/{p}/images/{i}/move(p=${product.id()}, i=${image.id()})}" method="post"
                          th:hx-post="@{/admin/products/{p}/images/{i}/move(p=${product.id()}, i=${image.id()})}" hx-target="#images" hx-swap="outerHTML">
                        <input type="hidden" name="direction" value="-1">
                        <button type="submit" class="text-brand-700 hover:underline" th:text="#{product.images.earlier}">Earlier</button>
                    </form>
                    <form th:unless="${state.last}" th:action="@{/admin/products/{p}/images/{i}/move(p=${product.id()}, i=${image.id()})}" method="post"
                          th:hx-post="@{/admin/products/{p}/images/{i}/move(p=${product.id()}, i=${image.id()})}" hx-target="#images" hx-swap="outerHTML">
                        <input type="hidden" name="direction" value="1">
                        <button type="submit" class="text-brand-700 hover:underline" th:text="#{product.images.later}">Later</button>
                    </form>
                    <form th:action="@{/admin/products/{p}/images/{i}/delete(p=${product.id()}, i=${image.id()})}" method="post"
                          th:hx-post="@{/admin/products/{p}/images/{i}/delete(p=${product.id()}, i=${image.id()})}" hx-target="#images" hx-swap="outerHTML"
                          th:hx-confirm="#{product.images.delete.confirm}">
                        <button type="submit" class="text-red-700 hover:underline" th:text="#{product.images.delete}">Remove</button>
                    </form>
                </div>
            </li>
        </ul>
        <form th:if="${product.images().size() < maxImages}"
              th:action="@{/admin/products/{id}/images(id=${product.id()})}" method="post" enctype="multipart/form-data"
              th:hx-post="@{/admin/products/{id}/images(id=${product.id()})}" hx-encoding="multipart/form-data"
              hx-target="#images" hx-swap="outerHTML" hx-disabled-elt="find button"
              class="mt-6 flex flex-wrap items-center gap-3">
            <label for="files" class="sr-only" th:text="#{product.images.choose}">Choose images</label>
            <input id="files" name="files" type="file" multiple accept="image/jpeg,image/png,image/webp" class="text-sm">
            <button type="submit" class="rounded-md bg-brand-600 px-4 py-2 text-sm font-medium text-white hover:bg-brand-700 disabled:opacity-50"
                    th:text="#{product.images.upload}">Upload</button>
            <p class="w-full text-xs text-gray-500" th:text="#{product.images.hint}">JPEG, PNG or WebP, up to 5 MB each.</p>
            <!--/* Filled by UploadLimitAdvice when the whole request is over the size limit. */-->
            <p id="upload-error" role="alert" class="w-full text-sm text-red-700"></p>
        </form>
    </section>

    <!--/* Options and variants */-->
    <section id="variants" th:fragment="variants" class="space-y-6 rounded-lg border border-gray-200 bg-white p-6">
        <th:block th:if="${variantsNotice != null}"><div th:replace="~{fragments/forms :: alert(kind='info', message=#{${variantsNotice}})}"></div></th:block>

        <div>
            <h2 class="text-lg font-semibold" th:text="#{product.options.heading}">Options</h2>
            <p class="mt-1 text-sm text-gray-600" th:text="#{product.options.hint}">Hint</p>
            <form th:object="${variantsForm}" th:action="@{/admin/products/{id}/options(id=${product.id()})}" method="post" novalidate
                  th:hx-post="@{/admin/products/{id}/options(id=${product.id()})}" hx-target="#variants" hx-swap="outerHTML"
                  class="mt-4 space-y-4">
                <th:block th:if="${#fields.hasErrors('options')}">
                    <div th:replace="~{fragments/forms :: alert(kind='error', message=${#fields.errors('options')[0]})}"></div>
                </th:block>
                <fieldset th:each="row, state : *{options}" class="grid gap-3 rounded-md border border-gray-200 p-4 sm:grid-cols-2">
                    <legend class="px-1 text-sm font-medium text-gray-700" th:text="#{product.options.row(${state.count})}">Option 1</legend>
                    <div th:replace="~{fragments/forms :: input(field='options[__${state.index}__].nameAr', label=#{product.options.nameAr})}"></div>
                    <div th:replace="~{fragments/forms :: input(field='options[__${state.index}__].nameEn', label=#{product.options.nameEn}, ltr=true)}"></div>
                    <div th:replace="~{fragments/forms :: input(field='options[__${state.index}__].valuesAr', label=#{product.options.valuesAr})}"></div>
                    <div th:replace="~{fragments/forms :: input(field='options[__${state.index}__].valuesEn', label=#{product.options.valuesEn}, ltr=true)}"></div>
                </fieldset>
                <button th:replace="~{fragments/forms :: submit(label=#{product.options.save})}">Save options</button>
            </form>
        </div>

        <div>
            <h2 class="text-lg font-semibold" th:text="#{product.variants.heading}">Variants and prices</h2>
            <form th:object="${variantsForm}" th:action="@{/admin/products/{id}/variants(id=${product.id()})}" method="post" novalidate
                  th:hx-post="@{/admin/products/{id}/variants(id=${product.id()})}" hx-target="#variants" hx-swap="outerHTML"
                  class="mt-4 space-y-4">
                <th:block th:if="${#fields.hasErrors('variants')}">
                    <div th:replace="~{fragments/forms :: alert(kind='error', message=${#fields.errors('variants')[0]})}"></div>
                </th:block>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="text-gray-600">
                        <tr>
                            <th scope="col" class="px-2 py-2 text-start font-medium" th:text="#{product.variants.col.variant}">Variant</th>
                            <th scope="col" class="px-2 py-2 text-start font-medium">
                                <span th:text="#{product.variants.col.price}">Price</span>
                                (<span th:text="#{currency.__${product.priceCurrency()}__}">SYP</span>)
                            </th>
                            <th scope="col" class="px-2 py-2 text-start font-medium" th:text="#{product.variants.col.compareAt}">Was</th>
                            <th scope="col" class="px-2 py-2 text-start font-medium" th:text="#{product.variants.col.sku}">SKU</th>
                            <th scope="col" class="px-2 py-2 text-start font-medium" th:text="#{product.variants.col.active}">On sale</th>
                        </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                        <tr th:each="row, state : *{variants}" class="align-top">
                            <td class="px-2 py-2">
                                <input type="hidden" th:field="*{variants[__${state.index}__].id}">
                                <span class="font-medium" th:text="${#strings.isEmpty(row.label)} ? #{product.variants.default} : ${row.label}">M / Red</span>
                            </td>
                            <td class="px-2 py-2">
                                <input type="text" inputmode="decimal" dir="ltr" th:field="*{variants[__${state.index}__].price}"
                                       class="w-32 rounded-md border px-2 py-1"
                                       th:classappend="${#fields.hasErrors('variants[__${state.index}__].price')} ? 'border-red-500' : 'border-gray-300'"
                                       th:attr="aria-label=#{product.variants.col.price}">
                                <p th:if="${#fields.hasErrors('variants[__${state.index}__].price')}" th:errors="*{variants[__${state.index}__].price}" class="text-xs text-red-600"></p>
                            </td>
                            <td class="px-2 py-2">
                                <input type="text" inputmode="decimal" dir="ltr" th:field="*{variants[__${state.index}__].compareAtPrice}"
                                       class="w-32 rounded-md border px-2 py-1"
                                       th:classappend="${#fields.hasErrors('variants[__${state.index}__].compareAtPrice')} ? 'border-red-500' : 'border-gray-300'"
                                       th:attr="aria-label=#{product.variants.col.compareAt}">
                                <p th:if="${#fields.hasErrors('variants[__${state.index}__].compareAtPrice')}" th:errors="*{variants[__${state.index}__].compareAtPrice}" class="text-xs text-red-600"></p>
                            </td>
                            <td class="px-2 py-2">
                                <input type="text" dir="ltr" th:field="*{variants[__${state.index}__].sku}"
                                       class="w-36 rounded-md border px-2 py-1"
                                       th:classappend="${#fields.hasErrors('variants[__${state.index}__].sku')} ? 'border-red-500' : 'border-gray-300'"
                                       th:attr="aria-label=#{product.variants.col.sku}">
                                <p th:if="${#fields.hasErrors('variants[__${state.index}__].sku')}" th:errors="*{variants[__${state.index}__].sku}" class="text-xs text-red-600"></p>
                            </td>
                            <td class="px-2 py-2">
                                <input type="checkbox" th:field="*{variants[__${state.index}__].active}" class="h-5 w-5"
                                       th:attr="aria-label=#{product.variants.col.active}">
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <button th:replace="~{fragments/forms :: submit(label=#{product.variants.save})}">Save prices</button>
            </form>
        </div>
    </section>

    <!--/* Details */-->
    <section class="rounded-lg border border-gray-200 bg-white p-6">
        <h2 class="text-lg font-semibold" th:text="#{product.details.heading}">Details</h2>
        <form th:action="@{/admin/products/{id}(id=${product.id()})}" th:object="${form}" method="post" novalidate class="mt-4 space-y-4">
            <th:block th:replace="~{merchantadmin/catalog/product-new :: fields}"></th:block>
            <button th:replace="~{fragments/forms :: submit(label=#{product.details.save})}">Save</button>
        </form>
    </section>
</main>
</body>
</html>
