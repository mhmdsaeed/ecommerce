<!DOCTYPE html>
<!--/* Categories. The "section" fragment (list + add form) is what HTMX requests get back. */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title th:text="#{category.title}">Categories</title>
</head>
<body>
<main layout:fragment="content">
    <h1 class="text-2xl font-bold" th:text="#{category.title}">Categories</h1>
    <div class="mt-4 space-y-2">
        <th:block th:if="${param.created}"><div th:replace="~{fragments/forms :: alert(kind='info', message=#{category.created})}"></div></th:block>
        <th:block th:if="${param.updated}"><div th:replace="~{fragments/forms :: alert(kind='info', message=#{category.updated})}"></div></th:block>
    </div>

    <section id="categories" th:fragment="section" class="mt-6 grid gap-8 lg:grid-cols-3">
        <div class="space-y-3 lg:col-span-2">
            <th:block th:if="${notice != null}"><div th:replace="~{fragments/forms :: alert(kind='info', message=#{${notice}})}"></div></th:block>
            <th:block th:if="${error != null}"><div th:replace="~{fragments/forms :: alert(kind='error', message=#{${error}})}"></div></th:block>

            <p th:if="${categories.isEmpty()}" class="rounded-lg border border-dashed border-gray-300 bg-white p-6 text-center text-gray-600"
               th:text="#{category.empty}">No categories yet.</p>

            <!--/* The categories as a tree, in the shop's order: a subcategory hangs off a line under its parent. Each
                   shows its address in the shop (a link while shoppers can see it: it and its parent are visible) and its number of products; a hidden one
                   is greyed. Rows stack on phones. */-->
            <ul th:unless="${categories.isEmpty()}" class="rounded-lg border border-gray-200 bg-white text-sm">
                <li th:each="category, state : ${categories}" class="px-4"
                    th:classappend="${category.topLevel() and !state.first} ? 'border-t border-gray-200' : ''">
                    <div class="grid gap-x-4 gap-y-2 py-3 md:grid-cols-[minmax(0,1fr)_auto_auto] md:items-center"
                         th:classappend="${category.topLevel()} ? '' : 'ms-3 border-s-2 border-gray-200 ps-4'">
                        <div th:with="shown=${inShop.contains(category.id())}" th:classappend="${shown} ? '' : 'opacity-60'">
                            <div th:class="${category.topLevel()} ? 'font-semibold' : 'font-medium'" th:text="${category.name().in(#locale)}">Name</div>
                            <a th:if="${shown and storeHost != null}" th:href="|//${storeHost}/c/${category.slug()}|"
                               target="_blank" rel="noopener" dir="ltr" class="text-xs text-brand-700 hover:underline"
                               th:text="'/c/' + ${category.slug()}">/c/slug</a>
                            <span th:unless="${shown and storeHost != null}" dir="ltr" class="text-xs text-gray-500"
                                  th:text="'/c/' + ${category.slug()}">/c/slug</span>
                        </div>
                        <div class="text-gray-600" th:with="plural=${@plurals.of(category.productCount())}" th:text="#{category.product-count.__${plural}__(${category.productCount()})}">3 products</div>
                        <div class="flex flex-wrap items-center gap-3 md:justify-end">
                            <span th:if="${inShop.contains(category.id())}" class="rounded-full bg-brand-50 px-2 py-0.5 text-xs text-brand-700" th:text="#{category.status.active}">Visible</span>
                            <span th:if="${category.active() and !inShop.contains(category.id())}" class="rounded-full bg-gray-100 px-2 py-0.5 text-xs text-gray-600" th:text="#{category.status.parent-hidden}">Hidden with its parent</span>
                            <span th:unless="${category.active()}" class="rounded-full bg-gray-100 px-2 py-0.5 text-xs text-gray-600" th:text="#{category.status.hidden}">Hidden</span>
                            <a th:href="@{/admin/categories/{id}/edit(id=${category.id()})}" class="text-brand-700 hover:underline"
                               th:text="#{category.action.edit}">Edit</a>
                            <form th:action="@{/admin/categories/{id}/active(id=${category.id()})}" method="post"
                                  th:hx-post="@{/admin/categories/{id}/active(id=${category.id()})}" hx-target="#categories" hx-swap="outerHTML">
                                <input type="hidden" name="active" th:value="${!category.active()}">
                                <button type="submit" class="text-brand-700 hover:underline"
                                        th:text="${category.active()} ? #{category.action.hide} : #{category.action.show}">Hide</button>
                            </form>
                            <form th:action="@{/admin/categories/{id}/delete(id=${category.id()})}" method="post"
                                  th:hx-post="@{/admin/categories/{id}/delete(id=${category.id()})}" hx-target="#categories" hx-swap="outerHTML"
                                  th:hx-confirm="#{category.delete.confirm}">
                                <button type="submit" class="text-red-700 hover:underline" th:text="#{category.action.delete}">Delete</button>
                            </form>
                        </div>
                    </div>
                </li>
            </ul>
        </div>

        <div class="rounded-lg border border-gray-200 bg-white p-6">
            <h2 class="text-lg font-semibold" th:text="#{category.add.heading}">Add a category</h2>
            <form th:action="@{/admin/categories}" th:object="${form}" method="post" class="mt-4 space-y-4" novalidate
                  th:hx-post="@{/admin/categories}" hx-target="#categories" hx-swap="outerHTML">
                <th:block th:replace="~{merchantadmin/catalog/category-edit :: fields}"></th:block>
                <button th:replace="~{fragments/forms :: submit(label=#{category.add.submit})}">Add</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
