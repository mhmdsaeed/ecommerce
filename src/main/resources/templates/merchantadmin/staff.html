<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title th:text="#{staff.title}">Staff</title>
</head>
<body>
<main layout:fragment="content" class="space-y-8">
    <h1 class="text-2xl font-bold" th:text="#{staff.heading}">Drivers and staff</h1>

    <th:block th:if="${param.added}"><div th:replace="~{fragments/forms :: alert(kind='info', message=#{staff.added})}"></div></th:block>
    <th:block th:if="${param.enabled}"><div th:replace="~{fragments/forms :: alert(kind='info', message=#{staff.enabled})}"></div></th:block>
    <th:block th:if="${param.disabled}"><div th:replace="~{fragments/forms :: alert(kind='info', message=#{staff.disabled})}"></div></th:block>
    <th:block th:if="${param.updated}"><div th:replace="~{fragments/forms :: alert(kind='info', message=#{staff.updated})}"></div></th:block>
    <th:block th:if="${param['password-set']}"><div th:replace="~{fragments/forms :: alert(kind='info', message=#{staff.password-set})}"></div></th:block>

    <section class="overflow-x-auto rounded-lg border border-gray-200 bg-white">
        <table class="w-full text-start text-sm">
            <thead class="bg-gray-50 text-gray-600">
            <tr>
                <th scope="col" class="px-4 py-3 text-start font-medium" th:text="#{staff.col.name}">Name</th>
                <th scope="col" class="px-4 py-3 text-start font-medium" th:text="#{staff.col.contact}">Contact</th>
                <th scope="col" class="px-4 py-3 text-start font-medium" th:text="#{staff.col.role}">Role</th>
                <th scope="col" class="px-4 py-3 text-start font-medium" th:text="#{staff.col.status}">Status</th>
                <th scope="col" class="px-4 py-3"><span class="sr-only" th:text="#{staff.col.actions}">Actions</span></th>
            </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
            <tr th:each="member : ${members}">
                <td class="px-4 py-3">
                    <span th:text="${member.name()}">Name</span>
                    <span th:if="${member.id() == currentStaff.staffId()}" class="text-xs text-gray-500"
                          th:text="#{staff.you}">(you)</span>
                </td>
                <td class="px-4 py-3 text-gray-600">
                    <div th:if="${member.phone() != null}" dir="ltr" class="text-end sm:text-start" th:text="${member.phone()}">+963…</div>
                    <div th:if="${member.email() != null}" dir="ltr" class="text-end sm:text-start" th:text="${member.email()}">a@b.c</div>
                </td>
                <td class="px-4 py-3" th:text="#{role.__${member.role()}__}">Role</td>
                <td class="px-4 py-3">
                    <span th:if="${member.active()}" class="rounded-full bg-brand-50 px-2 py-0.5 text-xs text-brand-700"
                          th:text="#{staff.status.active}">Active</span>
                    <span th:unless="${member.active()}" class="rounded-full bg-gray-100 px-2 py-0.5 text-xs text-gray-600"
                          th:text="#{staff.status.inactive}">Disabled</span>
                </td>
                <td class="px-4 py-3 text-end">
                    <div th:if="${member.id() != currentStaff.staffId() and currentStaff.role().canManage(member.role())}"
                         class="flex flex-wrap items-center justify-end gap-4">
                        <a th:href="@{/admin/staff/{id}(id=${member.id()})}" class="text-brand-700 hover:underline"
                           th:text="#{staff.action.edit}">Edit</a>
                        <form th:action="@{/admin/staff/{id}/active(id=${member.id()})}" method="post">
                            <input type="hidden" name="active" th:value="${!member.active()}">
                            <button type="submit" class="text-brand-700 hover:underline"
                                    th:text="${member.active()} ? #{staff.action.disable} : #{staff.action.enable}">Disable</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </section>

    <section class="max-w-lg rounded-lg border border-gray-200 bg-white p-6">
        <h2 class="text-lg font-semibold" th:text="#{staff.add.heading}">Add a staff member</h2>
        <form th:action="@{/admin/staff}" th:object="${form}" method="post" class="mt-4 space-y-4" novalidate>
            <div th:replace="~{fragments/forms :: input(field='name', label=#{staff.field.name}, autocomplete='off')}"></div>
            <div th:replace="~{fragments/forms :: input(field='phone', label=#{staff.field.phone}, type='tel',
                    autocomplete='off', ltr=true, hint=#{staff.field.contact.hint})}"></div>
            <div th:replace="~{fragments/forms :: input(field='email', label=#{staff.field.email}, type='email',
                    autocomplete='off', ltr=true)}"></div>
            <div class="space-y-1">
                <label for="role" class="block text-sm font-medium text-gray-800" th:text="#{staff.field.role}">Role</label>
                <select th:field="*{role}"
                        class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-base focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
                    <option th:each="role : ${assignableRoles}" th:value="${role}" th:text="#{role.__${role}__}">Role</option>
                </select>
                <p th:if="${#fields.hasErrors('role')}" th:errors="*{role}" class="text-sm text-red-600">Error</p>
            </div>
            <div th:replace="~{fragments/forms :: input(field='password', label=#{staff.field.password}, type='password',
                    autocomplete='new-password', hint=#{signup.field.password.hint})}"></div>
            <button th:replace="~{fragments/forms :: submit(label=#{staff.add.submit})}">Add</button>
        </form>
    </section>
</main>
</body>
</html>
