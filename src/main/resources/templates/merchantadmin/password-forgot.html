<!DOCTYPE html>
<!--/* Asks for the store and the email or phone to send a reset link to. After posting (?sent) it shows the same
       message whether or not such an account exists. */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title th:text="#{password.forgot.title}">Forgot your password?</title>
    <meta name="robots" content="noindex">
</head>
<body>
<main layout:fragment="content">
    <section class="mx-auto max-w-md overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm">
        <div th:replace="~{fragments/auth :: sign(store=${store}, domain=${storeDomain}, state='open', live=true)}"></div>
        <div class="p-6">
        <h1 class="text-2xl font-bold" th:text="#{password.forgot.heading}">Forgot your password?</h1>

        <th:block th:if="${param.sent}">
            <div class="mt-4"><div th:replace="~{fragments/forms :: alert(kind='info', message=#{password.forgot.sent(${minutes})})}"></div></div>
            <p class="mt-4 text-sm text-gray-600" th:text="#{password.forgot.no-message}">No message?</p>
        </th:block>

        <th:block th:unless="${param.sent}">
            <p class="mt-2 text-sm text-gray-600" th:text="#{password.forgot.intro}">Intro</p>
            <form th:action="@{/admin/password/forgot}" method="post" class="mt-4 space-y-4">
                <div class="space-y-1">
                    <label for="store" class="block text-sm font-medium text-gray-800" th:text="#{auth.field.store}">Store</label>
                    <div dir="ltr" class="flex items-stretch">
                        <input id="store" name="store" type="text" th:value="${store}" required autocomplete="organization"
                               autocapitalize="none" spellcheck="false" maxlength="64"
                               class="min-w-0 flex-1 rounded-s-md border border-gray-300 bg-white px-3 py-2 text-base focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
                        <span class="flex items-center rounded-e-md border border-s-0 border-gray-300 bg-gray-100 px-3 text-sm text-gray-600"
                              th:text="${storeDomain}">.example.com</span>
                    </div>
                </div>
                <div class="space-y-1">
                    <label for="username" class="block text-sm font-medium text-gray-800"
                           th:text="#{auth.field.username}">Email or phone</label>
                    <input id="username" name="username" type="text" dir="ltr" required autocomplete="username"
                           autocapitalize="none" spellcheck="false" maxlength="254"
                           class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-base focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
                </div>
                <button th:replace="~{fragments/forms :: submit(label=#{password.forgot.submit})}">Send link</button>
            </form>
        </th:block>

        <a th:href="@{/admin/login}" class="mt-6 inline-block text-sm text-brand-700 hover:underline"
           th:text="#{password.back-to-login}">Back to log in</a>
        </div>
    </section>
</main>
</body>
</html>
