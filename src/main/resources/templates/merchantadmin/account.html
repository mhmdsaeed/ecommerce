<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title th:text="#{account.title}">My account</title>
</head>
<body>
<main layout:fragment="content" class="space-y-8">
    <h1 class="text-2xl font-bold" th:text="#{account.heading}">My account</h1>

    <th:block th:if="${param.changed}"><div th:replace="~{fragments/forms :: alert(kind='info', message=#{account.password.changed})}"></div></th:block>

    <section class="max-w-lg rounded-lg border border-gray-200 bg-white p-6">
        <h2 class="text-lg font-semibold" th:text="#{account.password.heading}">Change your password</h2>
        <p class="mt-1 text-sm text-gray-600" th:text="#{account.password.intro}">Intro</p>
        <form th:action="@{/admin/account/password}" th:object="${passwordForm}" method="post" class="mt-4 space-y-4" novalidate>
            <div th:replace="~{fragments/forms :: input(field='currentPassword', label=#{account.field.current},
                    type='password', autocomplete='current-password')}"></div>
            <div th:replace="~{fragments/forms :: input(field='newPassword', label=#{account.field.new}, type='password',
                    autocomplete='new-password', hint=#{signup.field.password.hint})}"></div>
            <div th:replace="~{fragments/forms :: input(field='confirmPassword', label=#{account.field.confirm},
                    type='password', autocomplete='new-password')}"></div>
            <button th:replace="~{fragments/forms :: submit(label=#{account.password.submit})}">Change password</button>
        </form>
    </section>
</main>
</body>
</html>
