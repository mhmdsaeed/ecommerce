<!DOCTYPE html>
<!--/* Cash-on-delivery settlement (model: balances, CodSettlement.DriverBalances; names, staff names by id). */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title th:text="#{settlement.title}">Settlement</title>
</head>
<body>
<main layout:fragment="content">
    <h1 class="text-2xl font-bold" th:text="#{settlement.title}">Cash settlement</h1>
    <p class="mt-2 max-w-3xl text-sm text-gray-600" th:text="#{settlement.intro}">Intro</p>

    <p th:if="${balances.isEmpty()}" class="mt-6 rounded-lg border border-dashed border-gray-300 bg-white p-6 text-center text-gray-600"
       th:text="#{settlement.empty}">Nothing collected yet.</p>

    <div th:unless="${balances.isEmpty()}" class="mt-6 overflow-x-auto rounded-lg border border-gray-200 bg-white">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 text-gray-600">
            <tr>
                <th scope="col" class="px-4 py-3 text-start font-medium" th:text="#{admin.orders.col.driver}">Driver</th>
                <th scope="col" class="px-4 py-3 text-start font-medium" th:text="#{settlement.collected}">Collected</th>
                <th scope="col" class="px-4 py-3 text-start font-medium" th:text="#{settlement.remitted}">Handed over</th>
                <th scope="col" class="px-4 py-3 text-start font-medium" th:text="#{settlement.outstanding}">Outstanding</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
            <tr th:each="row : ${balances}">
                <td class="px-4 py-3">
                    <a th:href="@{/admin/settlement/{id}(id=${row.driverId()})}" class="font-medium text-brand-700 hover:underline"
                       th:text="${names.get(row.driverId())}">Driver</a>
                </td>
                <td class="px-4 py-3"><bdi th:each="balance : ${row.balances()}" class="block" th:text="${@money.format(balance.collected())}">0</bdi></td>
                <td class="px-4 py-3"><bdi th:each="balance : ${row.balances()}" class="block" th:text="${@money.format(balance.remitted())}">0</bdi></td>
                <td class="px-4 py-3 font-semibold" th:classappend="${row.settled()} ? 'text-gray-500' : 'text-amber-800'">
                    <bdi th:each="balance : ${row.balances()}" class="block" th:text="${@money.format(balance.outstanding())}">0</bdi>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
