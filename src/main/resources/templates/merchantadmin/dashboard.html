<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title th:text="#{dashboard.title}">Dashboard</title>
</head>
<body>
<main layout:fragment="content">
    <h1 class="text-2xl font-bold" th:text="#{dashboard.welcome(${currentStaff.name()})}">Welcome</h1>
    <p class="mt-2 text-gray-600">
        <span th:text="#{dashboard.store-address}">Your store address:</span>
        <a th:href="${storefrontUrl}" class="font-medium text-brand-700 hover:underline" dir="ltr"
           th:text="${storefrontHost}">demo1.example.com</a>
        <span class="ms-2 rounded-full bg-brand-50 px-2 py-0.5 text-xs font-medium text-brand-700"
              th:text="#{store.status.__${currentStore.status()}__}">Trial</span>
    </p>

    <div th:if="${rateMissing}" class="mt-6 flex flex-wrap items-center justify-between gap-3 rounded-md border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900">
        <span th:text="#{dashboard.rate-missing}">Set your exchange rate.</span>
        <a th:href="@{/admin/settings/pricing}" class="font-medium underline" th:text="#{dashboard.rate-missing.link}">Set rate</a>
    </div>

    <section class="mt-8 grid gap-4 sm:grid-cols-3" th:attr="aria-label=#{dashboard.orders}">
        <a th:href="@{/admin/orders(view='all')}" class="rounded-lg border border-gray-200 bg-white p-5 hover:border-brand-600">
            <span class="block text-sm text-gray-600" th:text="#{dashboard.orders.today}">Orders today</span>
            <span class="mt-1 block text-3xl font-bold" th:text="${#numbers.formatInteger(counts.placedSince(), 1)}">0</span>
        </a>
        <a th:href="@{/admin/orders(view='PENDING_CONFIRMATION')}" class="rounded-lg border bg-white p-5 hover:border-brand-600"
           th:classappend="${counts.toConfirm() > 0} ? 'border-amber-300' : 'border-gray-200'">
            <span class="block text-sm text-gray-600" th:text="#{dashboard.orders.to-confirm}">To confirm</span>
            <span class="mt-1 block text-3xl font-bold" th:text="${#numbers.formatInteger(counts.toConfirm(), 1)}">0</span>
        </a>
        <a th:href="@{/admin/orders(view='all', payment='AWAITING_VERIFICATION')}" class="rounded-lg border bg-white p-5 hover:border-brand-600"
           th:classappend="${counts.toVerify() > 0} ? 'border-amber-300' : 'border-gray-200'">
            <span class="block text-sm text-gray-600" th:text="#{dashboard.orders.to-verify}">Payments to check</span>
            <span class="mt-1 block text-3xl font-bold" th:text="${#numbers.formatInteger(counts.toVerify(), 1)}">0</span>
        </a>
    </section>
</main>
</body>
</html>
