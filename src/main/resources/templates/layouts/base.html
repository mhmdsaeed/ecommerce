<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      th:lang="${#locale.language}"
      th:dir="${#locale.language == 'ar'} ? 'rtl' : 'ltr'"
      th:attr="data-scheme=${colorScheme}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--/* Admin screens (colorScheme set): dark when the person chose dark, or chose "device" and the device is dark.
           Runs before the page paints, so a dark page never flashes white; follows the device as it changes. */-->
    <th:block th:if="${colorScheme != null}">
        <meta name="color-scheme" content="light dark">
        <script>
            (function (root) {
                var media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
                function apply() {
                    var dark = root.getAttribute("data-scheme") === "dark"
                        || (root.getAttribute("data-scheme") === "device" && media !== null && media.matches);
                    if (dark) { root.setAttribute("data-dark", ""); } else { root.removeAttribute("data-dark"); }
                }
                apply();
                if (media !== null && media.addEventListener) { media.addEventListener("change", apply); }
            })(document.documentElement);
        </script>
    </th:block>
    <title layout:title-pattern="$CONTENT_TITLE · $LAYOUT_TITLE" th:text="#{app.name}">App</title>
    <!--/* No favicon yet (store logos may become one): an empty icon stops browsers requesting /favicon.ico. */-->
    <link rel="icon" href="data:,">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/htmx.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
</head>
<!--/* hx-headers carries the CSRF token on every HTMX request. Storefront browse pages (storefrontPage) skip it:
       reading the token creates a session, which every anonymous visit would then pay for. The cart (M6) adds
       its own handling. themeStyle holds the store's colour and font variables, built from validated values only. */-->
<body class="min-h-screen bg-white font-sans text-gray-900 antialiased"
      th:style="${themeStyle}"
      th:hx-headers='${_csrf != null and storefrontPage == null} ? |{"${_csrf.headerName}": "${_csrf.token}"}| : null'>
<a href="#content" class="sr-only focus:not-sr-only focus:absolute focus:start-2 focus:top-2"
   th:text="#{layout.skip-to-content}">Skip to content</a>
<div layout:fragment="body"></div>
<!--/* Alpine last: it starts as soon as its script runs, so components must be registered first. Deferred scripts
       run in document order, so app.js and an area's own file (storefront.js, admin.js, placed by its layout inside
       the body) come before it. */-->
<script th:src="@{/js/alpine.min.js}" defer></script>
</body>
</html>
