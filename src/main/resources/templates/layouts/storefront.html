<!DOCTYPE html>
<!--/* Storefront layout. Pages fill "content". On a store, StorefrontAdvice provides shop, navigation, logoUrl and
       themeStyle; on the main site (no store) they are absent and the platform name shows instead. */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
    <title layout:title-pattern="$CONTENT_TITLE · $LAYOUT_TITLE"
           th:text="${shop != null} ? ${shop.name().in(#locale)} : #{app.name}">Store</title>
    <!--/* Shared SEO tags (SPEC 9.5); pages add their description, og:title, og:type and og:image. canonicalUrl
           comes from StorefrontAdvice: the page's address without tracking parameters. */-->
    <th:block th:if="${shop != null}">
        <meta property="og:site_name" th:content="${shop.name().in(#locale)}">
        <meta property="og:locale" th:content="${#locale.language == 'ar'} ? 'ar_SY' : 'en_US'">
    </th:block>
    <th:block th:if="${canonicalUrl != null}">
        <link rel="canonical" th:href="${canonicalUrl}">
        <meta property="og:url" th:content="${canonicalUrl}">
    </th:block>
    <th:block th:if="${seo != null}">
        <meta name="description" th:content="${seo.description()}">
        <meta property="og:type" th:content="${seo.type()}">
        <meta property="og:title" th:content="${seo.title()}">
        <meta property="og:description" th:content="${seo.description()}">
        <meta th:if="${seo.image() != null}" property="og:image" th:content="${seo.image()}">
        <meta name="twitter:card" th:content="${seo.image() != null} ? 'summary_large_image' : 'summary'">
    </th:block>
    <meta th:if="${storePreview != null}" name="robots" content="noindex">
</head>
<body>
<div layout:fragment="body" class="flex min-h-screen flex-col" data-area="storefront">
    <header class="border-b border-gray-200">
        <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-4 py-3">
            <a th:href="@{/}" class="flex items-center gap-2 text-lg font-semibold">
                <img th:if="${logoUrl != null}" th:src="${logoUrl}" alt="" width="40" height="40"
                     class="h-10 w-10 rounded object-contain">
                <span th:text="${shop != null} ? ${shop.name().in(#locale)} : #{app.name}">Store</span>
            </a>
            <form th:if="${shop != null}" th:action="@{/search}" method="get" role="search" class="order-last flex w-full gap-2 sm:order-none sm:w-auto">
                <label for="site-search" class="sr-only" th:text="#{shop.search}">Search</label>
                <input id="site-search" name="q" type="search" th:value="${q}" th:placeholder="#{shop.search}"
                       class="min-w-0 flex-1 rounded-md border border-gray-300 px-3 py-2 text-base focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600 sm:w-64">
                <button type="submit" class="rounded-md bg-brand-600 px-4 py-2 text-sm font-medium text-white hover:bg-brand-700"
                        th:text="#{shop.search.submit}">Search</button>
            </form>
            <div class="flex items-center gap-4 text-sm">
                <nav class="flex gap-3" th:attr="aria-label=#{shop.language}">
                    <a th:href="@{/lang/ar}" lang="ar" hreflang="ar" th:text="#{lang.ar}" rel="nofollow">العربية</a>
                    <a th:href="@{/lang/en}" lang="en" hreflang="en" th:text="#{lang.en}" rel="nofollow">English</a>
                </nav>
                <!--/* The count comes from the cart_count cookie (app.js: cartBadge), so the page is the same for everyone. */-->
                <a th:if="${shop != null}" th:href="@{/cart}" x-data="cartBadge"
                   x-on:cart-changed.window="refresh()" x-on:pageshow.window="refresh()"
                   class="inline-flex items-center gap-1.5 rounded-md border border-gray-300 px-3 py-1.5 font-medium hover:border-brand-600">
                    <span th:text="#{shop.cart}">Cart</span>
                    <span x-show="count > 0" x-text="count" x-cloak
                          class="min-w-5 rounded-full bg-brand-600 px-1.5 text-center text-xs leading-5 text-white"></span>
                </a>
            </div>
        </div>
        <nav th:if="${navigation != null and !navigation.isEmpty()}" class="border-t border-gray-100" th:attr="aria-label=#{shop.categories}">
            <ul class="mx-auto flex max-w-6xl gap-4 overflow-x-auto px-4 py-2 text-sm">
                <li th:each="link : ${navigation}" class="shrink-0">
                    <a th:href="@{/c/{slug}(slug=${link.slug()})}" class="hover:text-brand-700" th:text="${link.name().in(#locale)}">Category</a>
                </li>
            </ul>
        </nav>
    </header>
    <p th:if="${storePreview != null}" role="status"
       class="bg-amber-100 px-4 py-2 text-center text-sm text-amber-900" th:text="#{shop.preview}">Preview</p>
    <!--/* Shown by app.js when an HTMX request fails. */-->
    <div id="htmx-error" role="alert" hidden
         class="mx-auto mt-4 w-full max-w-6xl rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"
         th:text="#{shop.htmx-error}">Something went wrong.</div>
    <!--/* Width and padding live on a wrapper: a page's own class on its <main> replaces the layout's. */-->
    <div class="mx-auto w-full max-w-6xl flex-1 px-4 py-6">
        <main id="content" layout:fragment="content"></main>
    </div>
    <footer class="border-t border-gray-200 py-4 text-center text-xs text-gray-500">
        <p th:if="${shop != null and (shop.contactPhone() != null or shop.whatsapp() != null)}" class="mb-2 flex flex-wrap justify-center gap-4 text-sm">
            <a th:if="${shop.contactPhone() != null}" th:href="|tel:${shop.contactPhone()}|" class="hover:text-brand-700">
                <span th:text="#{shop.contact.phone}">Call</span> <bdi dir="ltr" th:text="${shop.contactPhone()}">+963</bdi>
            </a>
            <a th:if="${shop.whatsapp() != null}" th:href="|https://wa.me/${#strings.substringAfter(shop.whatsapp(), '+')}|"
               rel="noopener" class="hover:text-brand-700" th:text="#{shop.contact.whatsapp}">WhatsApp</a>
        </p>
        <span th:text="${shop != null} ? ${shop.name().in(#locale)} : #{app.name}">Store</span> ·
        <span th:text="#{layout.footer}">All rights reserved</span>
    </footer>
</div>
</body>
</html>
