<!DOCTYPE html>
<!--/* Layout for the platform admin on admin.<base>. Pages fill the "content" fragment. */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/base}">
<body>
<div layout:fragment="body" class="flex min-h-screen flex-col bg-gray-50" data-area="platform">
    <header class="border-b border-gray-200 bg-gray-900 text-white">
        <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-4 py-3">
            <a th:href="@{/platform}" class="text-lg font-semibold" th:text="#{platform.title}">Platform admin</a>
            <nav class="flex flex-wrap items-center gap-4 text-sm">
                <th:block sec:authorize="hasRole('PLATFORM_ADMIN')">
                    <!--/* The current section (platformSection, PlatformModelAdvice) is underlined and aria-current. */-->
                    <a th:each="link : ${ {'dashboard', 'stores', 'subscriptions', 'invoices', 'plans', 'reports'} }"
                       th:href="${link == 'dashboard'} ? @{/platform} : @{/platform/{section}(section=${link})}"
                       th:attr="aria-current=${platformSection == link} ? 'page'"
                       class="underline-offset-8 hover:underline"
                       th:classappend="${platformSection == link} ? 'font-semibold underline decoration-2'"
                       th:text="${link == 'dashboard'} ? #{platform.dashboard.title} : #{platform.nav.__${link}__}">Stores</a>
                    <span class="text-gray-300" sec:authentication="name">admin@example.com</span>
                    <form th:action="@{/platform/logout}" method="post">
                        <button type="submit" class="hover:underline" th:text="#{auth.logout}">Log out</button>
                    </form>
                    <form th:replace="~{fragments/scheme :: switch(action=@{/platform/scheme})}"></form>
                </th:block>
                <a th:href="@{''(lang='ar')}" lang="ar" th:text="#{lang.ar}">العربية</a>
                <a th:href="@{''(lang='en')}" lang="en" th:text="#{lang.en}">English</a>
            </nav>
        </div>
    </header>
    <!--/* Width and padding live on a wrapper: a page's own class on its <main> replaces the layout's. */-->
    <div class="mx-auto w-full max-w-6xl flex-1 px-4 py-8">
        <main id="content" layout:fragment="content"></main>
    </div>
</div>
</body>
</html>
