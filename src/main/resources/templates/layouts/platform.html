<!DOCTYPE html>
<!--/* Layout for the platform admin on admin.<base>. Pages fill the "content" fragment. */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/base}">
<body>
<div layout:fragment="body" class="flex min-h-screen flex-col bg-gray-50" data-area="platform">
    <!--/* Wide screens: the title, the sections and the account in one row. Phones: the title and a Menu button that
           opens the sections as a list, then the account (fragments/platform-nav.html), like the merchant admin. */-->
    <header class="relative border-b border-gray-200 bg-gray-900 text-white print:hidden">
        <div class="mx-auto flex max-w-6xl items-center justify-between gap-x-6 gap-y-3 px-4 py-3">
            <a th:href="@{/platform}" class="shrink-0 text-lg font-semibold" th:text="#{platform.title}">Platform admin</a>
            <th:block sec:authorize="hasRole('PLATFORM_ADMIN')">
                <nav class="hidden min-w-0 flex-1 text-sm lg:block" th:attr="aria-label=#{platform.nav.label}">
                    <ul th:replace="~{fragments/platform-nav :: links(stacked=false)}"></ul>
                </nav>
                <div class="hidden text-sm lg:block">
                    <div th:replace="~{fragments/platform-nav :: account}"></div>
                </div>
                <details class="lg:hidden">
                    <summary class="flex cursor-pointer list-none items-center gap-2 rounded-md border border-white/50 px-3 py-1.5 text-sm font-medium hover:bg-white/10 [&::-webkit-details-marker]:hidden"
                             th:text="#{admin.nav.menu}">Menu</summary>
                    <div class="absolute inset-x-0 top-full z-20 space-y-4 border-t border-white/20 bg-gray-900 px-4 py-4 text-sm shadow-lg">
                        <nav th:attr="aria-label=#{platform.nav.label}">
                            <ul th:replace="~{fragments/platform-nav :: links(stacked=true)}"></ul>
                        </nav>
                        <div class="border-t border-white/20 pt-4">
                            <div th:replace="~{fragments/platform-nav :: account}"></div>
                        </div>
                    </div>
                </details>
            </th:block>
            <nav sec:authorize="!hasRole('PLATFORM_ADMIN')" class="flex gap-4 text-sm" th:attr="aria-label=#{shop.language}">
                <a th:href="@{''(lang='ar')}" lang="ar" th:text="#{lang.ar}">العربية</a>
                <a th:href="@{''(lang='en')}" lang="en" th:text="#{lang.en}">English</a>
            </nav>
        </div>
    </header>
    <!--/* Width and padding live on a wrapper: a page's own class on its <main> replaces the layout's. */-->
    <div class="mx-auto w-full max-w-6xl flex-1 px-4 py-8">
        <main id="content" layout:fragment="content"></main>
    </div>
</div>
</body>
</html>
