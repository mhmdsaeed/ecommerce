<!DOCTYPE html>
<!--/* Layout for the merchant admin (and signup/login on the main site). Pages fill the "content" fragment.
       currentStaff and currentStore come from AdminModelAdvice and are null on public pages. */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<body>
<div layout:fragment="body" class="flex min-h-screen flex-col bg-gray-50" data-area="admin">
    <header class="border-b border-gray-200 bg-white">
        <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3 px-4 py-3">
            <a th:href="${currentStaff != null} ? @{/admin} : @{/}" class="text-lg font-semibold"
               th:text="${currentStore != null} ? ${currentStore.name().in(#locale)} : #{app.name}">App</a>
            <nav class="flex flex-wrap items-center gap-4 text-sm">
                <th:block th:if="${currentStaff != null}">
                    <a th:href="@{/admin}" th:text="#{admin.nav.dashboard}">Dashboard</a>
                    <a th:href="@{/admin/orders}" th:text="#{admin.nav.orders}">Orders</a>
                    <a th:href="@{/admin/customers}" th:text="#{admin.nav.customers}">Customers</a>
                    <a th:href="@{/admin/products}" th:text="#{admin.nav.products}">Products</a>
                    <a th:href="@{/admin/categories}" th:text="#{admin.nav.categories}">Categories</a>
                    <a th:href="@{/admin/inventory}" th:text="#{admin.nav.inventory}">Inventory</a>
                    <a th:if="${currentStaff.role().managesStaff()}" th:href="@{/admin/delivery}"
                       th:text="#{admin.nav.delivery}">Delivery</a>
                    <a th:if="${currentStaff.role().managesStaff()}" th:href="@{/admin/settings}"
                       th:text="#{admin.nav.settings}">Settings</a>
                    <a th:if="${currentStaff.role().managesStaff()}" th:href="@{/admin/staff}"
                       th:text="#{admin.nav.staff}">Staff</a>
                    <span class="text-gray-500" th:text="${currentStaff.name()}">Name</span>
                    <form th:action="@{/admin/logout}" method="post">
                        <button type="submit" class="text-brand-700 hover:underline"
                                th:text="#{auth.logout}">Log out</button>
                    </form>
                </th:block>
                <a th:href="@{''(lang='ar')}" lang="ar" th:text="#{lang.ar}">العربية</a>
                <a th:href="@{''(lang='en')}" lang="en" th:text="#{lang.en}">English</a>
            </nav>
        </div>
    </header>
    <!--/* Shown by app.js when an HTMX request fails: htmx does not swap error responses, so say something. */-->
    <div id="htmx-error" role="alert" hidden
         class="mx-auto mt-4 w-full max-w-5xl rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"
         th:text="#{admin.htmx-error}">Something went wrong.</div>
    <main id="content" class="mx-auto w-full max-w-5xl flex-1 px-4 py-8" layout:fragment="content"></main>
    <footer class="border-t border-gray-200 py-4 text-center text-xs text-gray-500" th:text="#{layout.footer}">
        All rights reserved
    </footer>
</div>
</body>
</html>
