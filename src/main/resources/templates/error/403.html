<!DOCTYPE html>
<!--/* Rendered by Spring Boot's error controller when a logged-in user opens a page their role does not allow. */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/storefront}">
<head>
    <title th:text="#{error.forbidden.title}">Access denied</title>
    <meta name="robots" content="noindex">
</head>
<body>
<main layout:fragment="content">
    <section th:replace="~{fragments/error :: page(code='403', sign=#{error.forbidden.sign}, heading=#{error.forbidden.heading}, body=#{error.forbidden.body})}"></section>
</main>
</body>
</html>
