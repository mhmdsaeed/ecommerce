<!DOCTYPE html>
<!--/* Rendered by Spring Boot's error controller when a shopper goes over a rate limit (StorefrontRateLimitFilter).
       The response carries Retry-After. */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/storefront}">
<head>
    <title th:text="#{error.too-many.title}">Too many requests</title>
    <meta name="robots" content="noindex">
</head>
<body>
<main layout:fragment="content">
    <section class="mx-auto max-w-2xl py-16 text-center">
        <p class="text-sm font-medium text-brand-600">429</p>
        <h1 class="mt-3 text-3xl font-bold tracking-tight" th:text="#{error.too-many.heading}">Please wait a moment</h1>
        <p class="mt-4 text-gray-600" th:text="#{error.too-many.body}">Body</p>
        <a th:href="@{/}" class="mt-6 inline-block font-medium text-brand-700 hover:underline" th:text="#{error.home}">Home</a>
    </section>
</main>
</body>
</html>
