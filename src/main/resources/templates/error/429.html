<!DOCTYPE html>
<!--/* Rendered by Spring Boot's error controller when a shopper goes over a rate limit (StorefrontRateLimitFilter).
       The response carries Retry-After. */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/storefront}">
<head>
    <title th:text="#{error.too-many.title}">Too many requests</title>
    <meta name="robots" content="noindex">
</head>
<body>
<main layout:fragment="content">
    <section th:replace="~{fragments/error :: page(code='429', sign=#{error.too-many.sign}, heading=#{error.too-many.heading}, body=#{error.too-many.body})}"></section>
</main>
</body>
</html>
