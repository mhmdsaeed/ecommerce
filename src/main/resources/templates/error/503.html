<!DOCTYPE html>
<!--/* Rendered by Spring Boot's error controller for any 503: a suspended store, or a store not launched yet
       (storeOpeningSoon, set by TenantResolutionFilter to the store's name). Neither shows the store's catalog or
       cart. A store opening soon shows its sign with the shutter down, as the merchant sees it on the setup page. */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/storefront}">
<head>
    <title th:text="${storeOpeningSoon != null} ? #{error.opening-soon.title} : #{error.unavailable.title}">Temporarily unavailable</title>
    <meta name="robots" content="noindex">
</head>
<body>
<main layout:fragment="content">
    <section class="mx-auto max-w-2xl py-12">
        <div th:if="${storeOpeningSoon != null}" class="shop-front mb-8" aria-hidden="true">
            <div class="shop-sign">
                <p class="shop-sign__name" dir="auto" th:text="${storeOpeningSoon.in(#locale)}">Store</p>
            </div>
            <div class="shop-front__door">
                <div class="shop-sign__shutter" style="height: 100%"></div>
            </div>
        </div>
        <h1 class="text-3xl font-bold tracking-tight"
            th:text="${storeOpeningSoon != null} ? #{error.opening-soon.heading} : #{error.unavailable.heading}">This store is temporarily unavailable</h1>
        <p class="mt-4 text-gray-600"
           th:text="${storeOpeningSoon != null} ? #{error.opening-soon.body} : #{error.unavailable.body}">Body</p>
    </section>
</main>
</body>
</html>
