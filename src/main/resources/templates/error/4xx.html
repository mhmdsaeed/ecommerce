<!DOCTYPE html>
<!--/* Rendered by Spring Boot's error controller for any 4xx without a page of its own. Never shows details:
       server.error.include-message and include-stacktrace are off. */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/storefront}">
<head>
    <title th:text="#{error.bad-request.title}">Error</title>
    <meta name="robots" content="noindex">
</head>
<body>
<main layout:fragment="content">
    <section class="mx-auto max-w-2xl py-16 text-center">
        <p class="text-sm font-medium text-brand-600" th:text="${status}">4xx</p>
        <h1 class="mt-3 text-3xl font-bold tracking-tight" th:text="#{error.bad-request.heading}">Something went wrong</h1>
        <p class="mt-4 text-gray-600" th:text="#{error.bad-request.body}">Body</p>
        <a th:href="@{/}" class="mt-6 inline-block font-medium text-brand-700 hover:underline" th:text="#{error.home}">Home</a>
    </section>
</main>
</body>
</html>
