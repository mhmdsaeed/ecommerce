<!DOCTYPE html>
<!--/* Rendered by Spring Boot's error controller for any 4xx without a page of its own. Never shows details:
       server.error.include-message and include-stacktrace are off. */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/storefront}">
<head>
    <title th:text="#{error.bad-request.title}">Error</title>
    <meta name="robots" content="noindex">
</head>
<body>
<main layout:fragment="content">
    <section th:replace="~{fragments/error :: page(code=${status}, sign=#{error.bad-request.sign}, heading=#{error.bad-request.heading}, body=#{error.bad-request.body})}"></section>
</main>
</body>
</html>
