<!DOCTYPE html>
<!--/* Rendered by Spring Boot's error controller for any 404, including unknown or closed store subdomains. */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/storefront}">
<head>
    <title th:text="#{error.not-found.title}">Not found</title>
    <meta name="robots" content="noindex">
</head>
<body>
<main layout:fragment="content">
    <section th:replace="~{fragments/error :: page(code='404', sign=#{error.not-found.sign}, heading=#{error.not-found.heading}, body=#{error.not-found.body})}"></section>
</main>
</body>
</html>
