<!DOCTYPE html>
<!--/* Rendered by Spring Boot's error controller for any 404, including unknown or closed store subdomains. */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/storefront}">
<head>
    <title th:text="#{error.not-found.title}">Not found</title>
</head>
<body>
<main layout:fragment="content">
    <section class="mx-auto max-w-2xl py-16 text-center">
        <p class="text-sm font-medium text-brand-600">404</p>
        <h1 class="mt-3 text-3xl font-bold tracking-tight" th:text="#{error.not-found.heading}">Page not found</h1>
        <p class="mt-4 text-gray-600" th:text="#{error.not-found.body}">Body</p>
    </section>
</main>
</body>
</html>
