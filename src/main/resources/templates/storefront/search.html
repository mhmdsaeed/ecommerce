<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/storefront}">
<head>
    <title th:text="#{shop.search}">Search</title>
    <meta name="robots" content="noindex">
</head>
<body>
<main layout:fragment="content">
    <h1 class="text-2xl font-bold"
        th:text="${q.isBlank()} ? #{shop.search} : #{shop.search.results(${q})}">Results</h1>
    <p th:if="${!q.isBlank() and results.products().isEmpty()}" class="mt-6 text-gray-600"
       th:text="#{shop.search.none}">Nothing found.</p>
    <h2 class="sr-only" th:unless="${results.products().isEmpty()}" th:text="#{shop.products}">Products</h2>
    <th:block th:unless="${results.products().isEmpty()}"><div class="mt-6" th:replace="~{storefront/fragments/catalog :: product-grid(products=${results.products()}, eagerCount=4)}"></div></th:block>
    <div th:replace="~{storefront/fragments/catalog :: pager(results=${results}, base=@{/search(q=${q})})}"></div>
</main>
</body>
</html>
