<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/storefront}">
<head>
    <title th:text="#{placeholder.title}">Coming soon</title>
</head>
<body>
<main layout:fragment="content">
    <section class="mx-auto max-w-2xl py-16 text-center">
        <p class="text-sm font-medium text-brand-600" th:text="#{placeholder.title}">Coming soon</p>
        <h1 th:if="${store != null}" class="mt-3 text-3xl font-bold tracking-tight sm:text-4xl"
            th:text="#{placeholder.store-welcome(${store.name().in(#locale)})}">Welcome to the store</h1>
        <h1 th:unless="${store != null}" class="mt-3 text-3xl font-bold tracking-tight sm:text-4xl"
            th:text="#{placeholder.heading}">Heading</h1>
        <p class="mt-4 text-start text-gray-600 sm:text-center" th:text="#{placeholder.body}">Body</p>
        <div th:if="${store == null}" class="mt-8 flex flex-wrap justify-center gap-3">
            <a th:href="@{/signup}" class="rounded-md bg-brand-600 px-4 py-2 font-medium text-white hover:bg-brand-700"
               th:text="#{placeholder.cta-signup}">Open your store</a>
            <a th:href="@{/admin/login}" class="rounded-md border border-gray-300 px-4 py-2 font-medium hover:bg-gray-50"
               th:text="#{placeholder.cta-login}">Merchant login</a>
        </div>
    </section>
</main>
</body>
</html>
