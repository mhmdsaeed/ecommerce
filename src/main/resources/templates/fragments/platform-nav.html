<!DOCTYPE html>
<!--/* The platform admin's navigation (layouts/platform.html), in the header on wide screens and in the Menu panel on
       phones. platformSection (PlatformModelAdvice) marks the current page. "links" are the sections, in a row or a
       list (stacked); "account" is who is logged in, logging out, light or dark, and the language. */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<ul th:fragment="links(stacked)" th:class="${stacked} ? 'space-y-1' : 'flex flex-wrap items-center gap-x-4 gap-y-1'">
    <li th:each="link : ${ {'dashboard', 'stores', 'subscriptions', 'invoices', 'plans', 'reports'} }">
        <a th:href="${link == 'dashboard'} ? @{/platform} : @{/platform/{section}(section=${link})}"
           th:attr="aria-current=${platformSection == link} ? 'page'"
           th:class="${stacked} ? 'block rounded-e-md border-s-[3px] px-3 py-2' : 'underline-offset-8 hover:underline'"
           th:classappend="${stacked}
                ? (${platformSection == link} ? 'border-brand-600 bg-white/10 font-semibold' : 'border-transparent hover:bg-white/5')
                : (${platformSection == link} ? 'font-semibold underline decoration-2' : '')"
           th:text="${link == 'dashboard'} ? #{platform.dashboard.title} : #{platform.nav.__${link}__}">Stores</a>
    </li>
</ul>

<div th:fragment="account" class="flex flex-wrap items-center gap-x-4 gap-y-2">
    <span class="text-gray-300" sec:authentication="name">admin@example.com</span>
    <form th:action="@{/platform/logout}" method="post">
        <button type="submit" class="hover:underline" th:text="#{auth.logout}">Log out</button>
    </form>
    <form th:replace="~{fragments/scheme :: switch(action=@{/platform/scheme})}"></form>
    <a th:href="@{''(lang='ar')}" lang="ar" th:text="#{lang.ar}">العربية</a>
    <a th:href="@{''(lang='en')}" lang="en" th:text="#{lang.en}">English</a>
</div>

</body>
</html>
