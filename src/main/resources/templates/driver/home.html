<!DOCTYPE html>
<!--/* The driver's open orders and the cash they hold (model: orders, OrderViews; cash, CodSettlement balances;
       done, a checked message key). */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/driver}">
<head>
    <title th:text="#{driver.home.title}">Deliveries</title>
</head>
<body>
<main layout:fragment="content" class="space-y-6">
    <h1 class="text-xl font-bold" th:text="#{driver.home.greeting(${currentStaff.name()})}">Hello</h1>

    <th:block th:if="${done != null}">
        <div th:replace="~{fragments/forms :: alert(kind='info', message=#{${done}})}"></div>
    </th:block>

    <section th:unless="${cash.isEmpty()}" class="rounded-lg border border-gray-200 p-4" aria-labelledby="cash-heading">
        <h2 id="cash-heading" class="text-sm text-gray-600" th:text="#{driver.cash}">Cash you hold</h2>
        <p th:each="balance : ${cash}" class="text-2xl font-bold">
            <bdi th:text="${@money.format(balance.outstanding())}">5,000</bdi>
        </p>
    </section>

    <p th:if="${orders.isEmpty()}" class="rounded-lg border border-dashed border-gray-300 p-6 text-center text-gray-600"
       th:text="#{driver.home.empty}">No deliveries.</p>

    <ul th:unless="${orders.isEmpty()}" class="space-y-3">
        <li th:each="order : ${orders}">
            <a th:href="@{/driver/orders/{number}(number=${order.number()})}"
               class="block rounded-lg border border-gray-200 p-4 hover:border-brand-600">
                <span class="flex items-center justify-between gap-3">
                    <span class="font-semibold" th:text="|#${order.number()} · ${order.customerName()}|">#1001 · Name</span>
                    <span class="rounded-full px-2 py-0.5 text-xs"
                          th:classappend="${order.status().name() == 'OUT_FOR_DELIVERY'} ? 'bg-brand-50 text-brand-700' : 'bg-gray-100 text-gray-700'"
                          th:text="#{order.status.__${order.status()}__}">Preparing</span>
                </span>
                <span class="mt-1 block text-sm text-gray-600">
                    <span th:text="${order.address().city()}">City</span><th:block th:if="${order.address().area() != null}"> ·
                    <span th:text="${order.address().area()}">Area</span></th:block>
                </span>
                <span th:unless="${order.paymentMethod().isTransfer()}" class="mt-1 block text-sm font-medium"
                      th:text="#{driver.collect(${@money.format(order.total())})}">Collect 5,000</span>
                <span th:if="${order.paymentMethod().isTransfer()}" class="mt-1 block text-sm text-gray-600"
                      th:text="#{driver.prepaid}">Paid by transfer</span>
            </a>
        </li>
    </ul>
</main>
</body>
</html>
