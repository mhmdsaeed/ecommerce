<!DOCTYPE html>
<!--/* One order for its driver (model: order, an Orders.OrderView; mapUrl; whatsapp; done and error, checked message
       keys). Big buttons: drivers use this on the road, one-handed. */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/driver}">
<head>
    <title th:text="|#${order.number()}|">#1001</title>
</head>
<body>
<main layout:fragment="content" class="space-y-5">
    <a th:href="@{/driver}" class="text-sm text-brand-700 hover:underline" th:text="#{driver.back}">My deliveries</a>
    <div>
        <h1 class="text-xl font-bold" th:text="|#${order.number()} · ${order.customerName()}|">#1001 · Name</h1>
        <p class="mt-1 text-sm text-gray-600" th:text="#{order.status.__${order.status()}__}">Preparing</p>
    </div>

    <th:block th:if="${done != null}">
        <div th:replace="~{fragments/forms :: alert(kind='info', message=#{${done}})}"></div>
    </th:block>
    <th:block th:if="${error != null}">
        <div th:replace="~{fragments/forms :: alert(kind='error', message=#{${error}})}"></div>
    </th:block>

    <div class="grid grid-cols-3 gap-2 text-center text-sm font-medium">
        <a th:href="|tel:${order.customerPhone()}|" class="rounded-lg border border-gray-300 px-2 py-3 hover:border-brand-600"
           th:text="#{driver.call}">Call</a>
        <a th:href="${whatsapp}" target="_blank" rel="noopener noreferrer"
           class="rounded-lg border border-gray-300 px-2 py-3 hover:border-brand-600" th:text="#{driver.whatsapp}">WhatsApp</a>
        <a th:href="${mapUrl}" target="_blank" rel="noopener noreferrer"
           class="rounded-lg border border-gray-300 px-2 py-3 hover:border-brand-600" th:text="#{driver.map}">Map</a>
    </div>

    <section class="space-y-1 rounded-lg border border-gray-200 p-4 text-sm" aria-labelledby="address-heading">
        <h2 id="address-heading" class="font-semibold" th:text="#{checkout.address}">Address</h2>
        <p dir="ltr" class="text-start" th:text="${order.customerPhone()}">+963</p>
        <p>
            <span th:text="#{governorate.__${order.address().governorate()}__}">Damascus</span> ›
            <span th:text="${order.address().city()}">City</span><th:block th:if="${order.address().area() != null}"> ›
            <span th:text="${order.address().area()}">Area</span></th:block>
        </p>
        <p th:if="${order.address().landmark() != null}" class="font-medium" th:text="${order.address().landmark()}">Landmark</p>
        <p th:if="${order.address().details() != null}" th:text="${order.address().details()}">Details</p>
        <p th:if="${order.notes() != null}" class="whitespace-pre-line text-gray-600" th:text="${order.notes()}">Notes</p>
    </section>

    <section class="rounded-lg border border-gray-200 p-4 text-sm" aria-labelledby="items-heading">
        <h2 id="items-heading" class="font-semibold" th:text="#{order.items}">Items</h2>
        <ul class="mt-2 space-y-1">
            <li th:each="item : ${order.items()}" th:text="|${item.quantity()} × ${item.name().in(#locale)}|">1 × Product</li>
        </ul>
        <p th:unless="${order.paymentMethod().isTransfer()}" class="mt-3 text-base font-bold"
           th:text="#{driver.collect(${@money.format(order.total())})}">Collect 5,000</p>
        <p th:if="${order.paymentMethod().isTransfer()}" class="mt-3 text-gray-600" th:text="#{driver.prepaid}">Paid by transfer</p>
    </section>

    <form th:if="${order.status().name() == 'PREPARING'}" method="post"
          th:action="@{/driver/orders/{number}/start(number=${order.number()})}">
        <button type="submit" class="w-full rounded-lg bg-brand-600 px-4 py-4 text-lg font-semibold text-white hover:bg-brand-700"
                th:text="#{driver.action.start}">I picked it up</button>
    </form>
    <p th:if="${order.status().name() == 'CONFIRMED'}" class="rounded-lg bg-gray-50 p-3 text-sm text-gray-600"
       th:text="#{driver.not-ready}">Not ready yet.</p>

    <th:block th:if="${order.status().name() == 'OUT_FOR_DELIVERY'}">
        <form method="post" th:action="@{/driver/orders/{number}/deliver(number=${order.number()})}" class="space-y-2">
            <th:block th:unless="${order.paymentMethod().isTransfer()}">
                <label for="collected" class="block text-sm font-medium" th:text="#{driver.collected}">Cash collected</label>
                <input id="collected" name="collected" type="text" inputmode="decimal" dir="ltr" required
                       th:value="${order.total().amount().stripTrailingZeros().toPlainString()}"
                       class="w-full rounded-lg border border-gray-300 px-3 py-3 text-lg focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
            </th:block>
            <button type="submit" class="w-full rounded-lg bg-brand-600 px-4 py-4 text-lg font-semibold text-white hover:bg-brand-700"
                    th:text="${order.paymentMethod().isTransfer()} ? #{driver.action.deliver} : #{driver.action.deliver-cash}">Delivered</button>
        </form>
        <details class="rounded-lg border border-gray-200 p-3">
            <summary class="cursor-pointer font-medium text-red-700" th:text="#{driver.action.refuse}">Customer refused</summary>
            <form method="post" th:action="@{/driver/orders/{number}/refuse(number=${order.number()})}" class="mt-3 space-y-2">
                <label for="reason" class="block text-sm font-medium" th:text="#{driver.refuse.reason}">Why?</label>
                <input id="reason" name="reason" type="text" maxlength="200"
                       class="w-full rounded-lg border border-gray-300 px-3 py-3 text-base focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
                <button type="submit" class="w-full rounded-lg bg-red-700 px-4 py-3 font-semibold text-white hover:bg-red-800"
                        th:text="#{driver.action.refuse}">Customer refused</button>
            </form>
        </details>
    </th:block>
</main>
</body>
</html>
