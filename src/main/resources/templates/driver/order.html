<!DOCTYPE html>
<!--/* One order for its driver (model: order, an Orders.OrderView; mapUrl; whatsapp; done and error, checked message
       keys). Drivers use this on the road, one-handed, often in sunlight: large type and buttons, the landmark first
       in the address (Syrian addresses rely on it), and the next step in a bar at the bottom of the screen, within
       reach of the thumb. Refusal stays behind a disclosure, a deliberate extra tap. */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/driver}">
<head>
    <title th:text="|#${order.number()}|">#1001</title>
</head>
<body>
<main layout:fragment="content" class="space-y-5">
    <a th:href="@{/driver}" class="inline-block py-1 font-medium text-brand-700 hover:underline" th:text="#{driver.back}">My deliveries</a>
    <div>
        <p class="text-sm font-semibold text-gray-600">
            <span th:text="|#${order.number()}|">#1001</span>
            <span class="ms-2 rounded-full bg-gray-100 px-2.5 py-0.5 font-medium text-gray-800"
                  th:text="#{order.status.__${order.status()}__}">Preparing</span>
        </p>
        <h1 class="mt-1 text-2xl font-bold" th:text="${order.customerName()}">Name</h1>
    </div>

    <th:block th:if="${done != null}">
        <div th:replace="~{fragments/forms :: alert(kind='info', message=#{${done}})}"></div>
    </th:block>
    <th:block th:if="${error != null}">
        <div th:replace="~{fragments/forms :: alert(kind='error', message=#{${error}})}"></div>
    </th:block>

    <div class="grid grid-cols-3 gap-2 text-center font-semibold">
        <a th:href="|tel:${order.customerPhone()}|" class="rounded-lg bg-brand-600 px-2 py-4 text-white hover:bg-brand-700"
           th:text="#{driver.call}">Call</a>
        <a th:href="${whatsapp}" target="_blank" rel="noopener noreferrer"
           class="rounded-lg border-2 border-gray-300 px-2 py-4 hover:border-brand-600" th:text="#{driver.whatsapp}">WhatsApp</a>
        <a th:href="${mapUrl}" target="_blank" rel="noopener noreferrer"
           class="rounded-lg border-2 border-gray-300 px-2 py-4 hover:border-brand-600" th:text="#{driver.map}">Map</a>
    </div>

    <section class="rounded-lg border-2 border-gray-300 p-4" aria-labelledby="address-heading">
        <h2 id="address-heading" class="text-sm font-semibold text-gray-600" th:text="#{checkout.address}">Address</h2>
        <p th:if="${order.address().landmark() != null}" class="mt-1 text-xl font-bold" th:text="${order.address().landmark()}">Near the mosque</p>
        <p class="mt-1 text-lg">
            <span th:text="#{governorate.__${order.address().governorate()}__}">Damascus</span> ›
            <span th:text="${order.address().city()}">City</span><th:block th:if="${order.address().area() != null}"> ›
            <span th:text="${order.address().area()}">Area</span></th:block>
        </p>
        <p th:if="${order.address().details() != null}" class="mt-1" th:text="${order.address().details()}">Details</p>
        <p class="mt-1 tabular-nums text-gray-700"><bdi dir="ltr" th:text="${order.customerPhone()}">+963</bdi></p>
        <p th:if="${order.notes() != null}" class="mt-3 whitespace-pre-line rounded-md bg-amber-50 p-3 text-amber-950"
           th:text="${order.notes()}">Notes</p>
    </section>

    <section class="overflow-hidden rounded-lg border-2 border-gray-300" aria-labelledby="items-heading">
        <div class="p-4">
            <h2 id="items-heading" class="text-sm font-semibold text-gray-600" th:text="#{order.items}">Items</h2>
            <ul class="mt-2 space-y-1 text-lg">
                <li th:each="item : ${order.items()}" th:text="|${item.quantity()} × ${item.name().in(#locale)}|">1 × Product</li>
            </ul>
        </div>
        <div class="slip__tear" aria-hidden="true"></div>
        <div class="p-4">
            <p th:unless="${order.paymentMethod().isTransfer()}" class="text-2xl font-bold tabular-nums"
               th:text="#{driver.collect(${@money.format(order.total())})}">Collect 5,000</p>
            <p th:if="${order.paymentMethod().isTransfer() and !order.awaitsTransfer()}" class="text-lg text-gray-600" th:text="#{driver.prepaid}">Paid by transfer</p>
            <!--/* Given to the driver before its transfer was approved: the store has no money yet. */-->
            <p th:if="${order.awaitsTransfer()}" class="rounded-md bg-amber-50 p-3 text-lg font-bold text-amber-900" th:text="#{driver.unpaid}">Not paid yet</p>
        </div>
    </section>

    <p th:if="${order.status().name() == 'CONFIRMED'}" class="rounded-lg bg-gray-100 p-4 text-gray-700"
       th:text="#{driver.not-ready}">Not ready yet.</p>

    <details th:if="${order.status().name() == 'OUT_FOR_DELIVERY'}" class="rounded-lg border-2 border-gray-300 p-4">
        <summary class="cursor-pointer font-semibold text-red-700" th:text="#{driver.action.refuse}">Customer refused</summary>
        <form method="post" th:action="@{/driver/orders/{number}/refuse(number=${order.number()})}" class="mt-3 space-y-2">
            <label for="reason" class="block text-sm font-medium" th:text="#{driver.refuse.reason}">Why?</label>
            <input id="reason" name="reason" type="text" maxlength="200"
                   class="w-full rounded-lg border-2 border-gray-300 px-3 py-3 text-base focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
            <button type="submit" class="w-full rounded-lg bg-red-700 px-4 py-3 font-semibold text-white hover:bg-red-800"
                    th:text="#{driver.action.refuse}">Customer refused</button>
        </form>
    </details>

    <!--/* The next step, kept at the bottom of the screen while the page scrolls. */-->
    <div th:if="${order.status().name() == 'PREPARING' or order.status().name() == 'OUT_FOR_DELIVERY'}"
         class="sticky bottom-0 -mx-4 border-t border-gray-200 bg-white px-4 py-3">
        <form th:if="${order.status().name() == 'PREPARING'}" method="post"
              th:action="@{/driver/orders/{number}/start(number=${order.number()})}">
            <button type="submit" class="w-full rounded-lg bg-brand-600 px-4 py-4 text-lg font-semibold text-white hover:bg-brand-700"
                    th:text="#{driver.action.start}">I picked it up</button>
        </form>
        <form th:if="${order.status().name() == 'OUT_FOR_DELIVERY'}" method="post"
              th:action="@{/driver/orders/{number}/deliver(number=${order.number()})}" class="space-y-2">
            <div th:unless="${order.paymentMethod().isTransfer()}" class="flex items-center gap-3">
                <label for="collected" class="shrink-0 text-sm font-medium" th:text="#{driver.collected}">Cash collected</label>
                <input id="collected" name="collected" type="text" inputmode="decimal" dir="ltr" required
                       th:value="${order.total().amount().stripTrailingZeros().toPlainString()}"
                       class="min-w-0 flex-1 rounded-lg border-2 border-gray-300 px-3 py-2.5 text-lg tabular-nums focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
            </div>
            <button type="submit" class="w-full rounded-lg bg-brand-600 px-4 py-4 text-lg font-semibold text-white hover:bg-brand-700"
                    th:text="${order.paymentMethod().isTransfer()} ? #{driver.action.deliver} : #{driver.action.deliver-cash}">Delivered</button>
        </form>
    </div>
</main>
</body>
</html>
