# Integration tests. Database properties are supplied by TestcontainersConfig.
spring:
  flyway:
    # db/testmigration holds test-only tables, such as the isolation_probe tenant table.
    locations: classpath:db/migration, classpath:db/testmigration

app:
  # Every MockMvc request comes from 127.0.0.1 and the context is shared between test classes, so per-address
  # limits would add up across the suite. RateLimitIT turns them on in a context of its own.
  rate-limits:
    enabled: false
  # Tests sign API tokens with this key (ApiIT).
  api:
    jwt-secret: test-only-jwt-secret-0123456789abcdef
  # Fixed so tests do not depend on the developer's APP_BASE_DOMAIN.
  base-domain: lvh.me:8080
  notification:
    link-scheme: http
    # Tests read verification codes from the log, like a developer on a local run.
    log-content: true

# Tests run jobs themselves (NotificationIT starts a JobRunr server of its own); queued jobs just wait.
jobrunr:
  background-job-server:
    enabled: false

management:
  endpoint:
    health:
      show-details: always
