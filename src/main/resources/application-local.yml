# Local development against docker-compose. Defaults match .env.example.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ecommerce}
    username: ${DB_APP_USER:app_user}
    password: ${DB_APP_PASSWORD:app_user_local}
  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ecommerce}
    user: ${DB_OWNER_USER:app_owner}
    password: ${DB_OWNER_PASSWORD:app_owner_local}
  # Edit templates and CSS without restarting (run ./scripts/tailwind.sh --watch alongside).
  thymeleaf:
    cache: false
    prefix: file:src/main/resources/templates/
  web:
    resources:
      static-locations: file:src/main/resources/static/, file:target/classes/static/
      cache:
        period: 0

server:
  servlet:
    session:
      cookie:
        # Local runs are plain http, where browsers drop Secure cookies.
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  platform-datasource:
    username: ${DB_PLATFORM_USER:app_platform}
    password: ${DB_PLATFORM_PASSWORD:app_platform_local}
  # Local-only credentials: http://admin.lvh.me:8080
  platform-admin:
    email: ${PLATFORM_ADMIN_EMAIL:admin@lvh.me}
    password: ${PLATFORM_ADMIN_PASSWORD:local-admin-pass}

management:
  endpoint:
    health:
      show-details: always
