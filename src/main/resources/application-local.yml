# Local development against docker-compose. Defaults match .env.example.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ecommerce}
    username: ${DB_APP_USER:app_user}
    password: ${DB_APP_PASSWORD:app_user_local}
  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ecommerce}
    user: ${DB_OWNER_USER:app_owner}
    password: ${DB_OWNER_PASSWORD:app_owner_local}
  # docker-compose Mailpit: http://localhost:8025 shows what was sent.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:false}
  # Edit templates and CSS without restarting (run ./scripts/tailwind.sh --watch alongside).
  thymeleaf:
    cache: false
    prefix: file:src/main/resources/templates/
  web:
    resources:
      static-locations: file:src/main/resources/static/, file:target/classes/static/
      # Edits show up at once: hashes are recomputed per request and browsers do not cache.
      chain:
        cache: false
      cache:
        cachecontrol:
          no-store: true

server:
  servlet:
    session:
      cookie:
        # Local runs are plain http, where browsers drop Secure cookies.
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  platform-datasource:
    username: ${DB_PLATFORM_USER:app_platform}
    password: ${DB_PLATFORM_PASSWORD:app_platform_local}
  # Local-only credentials: http://admin.lvh.me:8080
  platform-admin:
    email: ${PLATFORM_ADMIN_EMAIL:admin@lvh.me}
    password: ${PLATFORM_ADMIN_PASSWORD:local-admin-pass}
  # docker-compose MinIO (host port 9100). The app creates the bucket and makes public/ readable.
  media:
    endpoint: ${S3_ENDPOINT:http://localhost:9100}
    bucket: ${S3_BUCKET:media}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9100/media}
    manage-bucket: ${S3_MANAGE_BUCKET:true}
  billing:
    pay-to: ${BILLING_PAY_TO:Sham Cash 0944 000 000 (Unispark)}
  notification:
    mail-from: ${MAIL_FROM:orders@lvh.me}
    link-scheme: ${APP_LINK_SCHEME:http}

management:
  endpoint:
    health:
      show-details: always
