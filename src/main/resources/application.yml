# Shared configuration. Secrets and connection details come from environment variables (SPEC 15).
spring:
  application:
    name: ecommerce
  # Each security chain brings its own authentication; Boot's generated in-memory "user" must never exist.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  threads:
    virtual:
      enabled: true
  # Runtime connections use app_user (NOBYPASSRLS, owns nothing).
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
  # Flyway connects separately as the schema owner. The url is explicit because Flyway cannot derive it from
  # the tenant-bound DataSource wrapper. The empty default only matters while auto-configuration conditions are
  # evaluated, before test properties exist; a missing DB_URL still fails on the application DataSource.
  flyway:
    url: ${DB_URL:}
    user: ${DB_OWNER_USER}
    password: ${DB_OWNER_PASSWORD}
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      # Loads the variants and images of a page of products in a few queries instead of one per product.
      hibernate.default_batch_fetch_size: 32
  # Coarse guard only: MediaProperties enforces the 5 MB per image with a proper message.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB
  # SPEC 9.5: content-hashed URLs for CSS and JS (Thymeleaf's @{...} links get the hash), cached for a year.
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: /css/**, /js/**
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true
  modulith:
    events:
      # Event listeners that failed (e.g. storage down while discarding images) run again after a restart.
      republish-outstanding-events-on-restart: true
  # Global problem details would answer every unknown URL with JSON, even for browsers. RFC 7807 errors come with
  # the REST API (M14), scoped to /api/**; pages get the localized error templates.
  mvc:
    problemdetails:
      enabled: false
  # SMTP for email notifications (SPEC 12, 15). Without MAIL_HOST, emails only go to the application log.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

# Background jobs (SPEC 14). Flyway creates JobRunr's tables as the schema owner (V13), so JobRunr only checks them.
jobrunr:
  database:
    skip-create: true
  background-job-server:
    enabled: true
  dashboard:
    enabled: false
  miscellaneous:
    allow-anonymous-data-usage: false

server:
  # Read the rest of an oversized upload, so the browser gets the error page instead of a reset connection.
  tomcat:
    max-swallow-size: 64MB
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # SPEC 10. Only plain-http local development turns this off.
        secure: ${SESSION_COOKIE_SECURE:true}

# OpenAPI for the REST API (SPEC 13): the UI at /api/docs, the document at /api/docs/openapi.json. Only the API's
# controllers are described, not the HTML pages.
springdoc:
  packages-to-scan: com.unispark.ecommerce.api
  paths-to-match: /api/v1/**
  api-docs:
    path: /api/docs/openapi.json
  swagger-ui:
    path: /api/docs
    url: /api/docs/openapi.json
    disable-swagger-default-url: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
  # An SMTP outage must not mark the app down: failed emails stay in notification_log and JobRunr retries them.
  health:
    mail:
      enabled: false

app:
  base-domain: ${APP_BASE_DOMAIN:lvh.me:8080}
  # Cross-tenant access for platform admin and billing (PlatformDatabase): same database, BYPASSRLS role.
  platform-datasource:
    username: ${DB_PLATFORM_USER}
    password: ${DB_PLATFORM_PASSWORD}
  # Creates the first platform admin on startup while no platform user exists (PlatformAdminBootstrap).
  platform-admin:
    email: ${PLATFORM_ADMIN_EMAIL:}
    password: ${PLATFORM_ADMIN_PASSWORD:}
  # S3-compatible storage for images (SPEC 15). S3_ENDPOINT is empty for AWS S3, set for MinIO or Cloudflare R2.
  media:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    public-base-url: ${S3_PUBLIC_BASE_URL}
    # Host in signed links to private images (payment screenshots), as browsers reach storage. Empty: S3_ENDPOINT.
    presign-endpoint: ${S3_PRESIGN_ENDPOINT:}
    manage-bucket: ${S3_MANAGE_BUCKET:false}
  # REST API bearer tokens (SPEC 13): HS256, at least 32 bytes. Without it the API refuses every token.
  api:
    jwt-secret: ${JWT_SECRET:}
  # SaaS billing (SPEC 8). BILLING_PAY_TO tells merchants where to send payments, e.g. a wallet number.
  billing:
    pay-to: ${BILLING_PAY_TO:}
    trial-days: ${BILLING_TRIAL_DAYS:14}
    grace-days: ${BILLING_GRACE_DAYS:7}
  # Messages to shoppers and merchants (SPEC 12). SMS and WhatsApp are adapter stubs until a provider is chosen.
  notification:
    mail-from: ${MAIL_FROM:}
    link-scheme: ${APP_LINK_SCHEME:https}
    sms:
      provider: ${SMS_PROVIDER:}
      api-key: ${SMS_API_KEY:}
    whatsapp:
      token: ${WHATSAPP_TOKEN:}
      phone-id: ${WHATSAPP_PHONE_ID:}
