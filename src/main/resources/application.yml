# Shared configuration. Secrets and connection details come from environment variables (SPEC 15).
spring:
  application:
    name: ecommerce
  # Each security chain brings its own authentication; Boot's generated in-memory "user" must never exist.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  threads:
    virtual:
      enabled: true
  # Runtime connections use app_user (NOBYPASSRLS, owns nothing).
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
  # Flyway connects separately as the schema owner. The url is explicit because Flyway cannot derive it from
  # the tenant-bound DataSource wrapper. The empty default only matters while auto-configuration conditions are
  # evaluated, before test properties exist; a missing DB_URL still fails on the application DataSource.
  flyway:
    url: ${DB_URL:}
    user: ${DB_OWNER_USER}
    password: ${DB_OWNER_PASSWORD}
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      # Loads the variants and images of a page of products in a few queries instead of one per product.
      hibernate.default_batch_fetch_size: 32
  # Coarse guard only: MediaProperties enforces the 5 MB per image with a proper message.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB
  modulith:
    events:
      # Event listeners that failed (e.g. storage down while discarding images) run again after a restart.
      republish-outstanding-events-on-restart: true
  # Global problem details would answer every unknown URL with JSON, even for browsers. RFC 7807 errors come with
  # the REST API (M14), scoped to /api/**; pages get the localized error templates.
  mvc:
    problemdetails:
      enabled: false

server:
  # Read the rest of an oversized upload, so the browser gets the error page instead of a reset connection.
  tomcat:
    max-swallow-size: 64MB
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # SPEC 10. Only plain-http local development turns this off.
        secure: ${SESSION_COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

app:
  base-domain: ${APP_BASE_DOMAIN:lvh.me:8080}
  # Cross-tenant access for platform admin and billing (PlatformDatabase): same database, BYPASSRLS role.
  platform-datasource:
    username: ${DB_PLATFORM_USER}
    password: ${DB_PLATFORM_PASSWORD}
  # Creates the first platform admin on startup while no platform user exists (PlatformAdminBootstrap).
  platform-admin:
    email: ${PLATFORM_ADMIN_EMAIL:}
    password: ${PLATFORM_ADMIN_PASSWORD:}
  # S3-compatible storage for images (SPEC 15). S3_ENDPOINT is empty for AWS S3, set for MinIO or Cloudflare R2.
  media:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    public-base-url: ${S3_PUBLIC_BASE_URL}
    manage-bucket: ${S3_MANAGE_BUCKET:false}
