name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache Tailwind CLI
        uses: actions/cache@v4
        with:
          path: .tools
          key: tailwind-${{ runner.os }}-${{ hashFiles('scripts/tailwind.sh') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pom.xml') }}

      # Chromium and its system libraries for the browser smoke test (CheckoutE2EIT), with the pom's Playwright.
      - name: Install Playwright Chromium
        run: ./mvnw -B -ntp exec:java -Dexec.classpathScope=test -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      # Tailwind build, unit tests, Testcontainers integration tests (Docker is available on ubuntu-latest).
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

      - name: Upload module documentation
        uses: actions/upload-artifact@v4
        with:
          name: modulith-docs
          path: target/spring-modulith-docs

      # SPEC 16: the production image, from the jar verify just built and tested (see Dockerfile). Built on main
      # only; pushing it to a registry comes with the hosting choice.
      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker build -t ecommerce:${{ github.sha }} .
