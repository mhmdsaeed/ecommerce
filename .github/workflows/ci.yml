name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache Tailwind CLI
        uses: actions/cache@v4
        with:
          path: .tools
          key: tailwind-${{ runner.os }}-${{ hashFiles('scripts/tailwind.sh') }}

      # Tailwind build, unit tests, Testcontainers integration tests (Docker is available on ubuntu-latest).
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

      - name: Upload module documentation
        uses: actions/upload-artifact@v4
        with:
          name: modulith-docs
          path: target/spring-modulith-docs
